<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#6366f1;--p2:#8b5cf6;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--ok:#22c55e;--no:#ef4444}
body{font-family:'Lora',serif;background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7);min-height:100vh;color:var(--ink);padding:30px 16px}
.topbar{max-width:860px;margin:0 auto 16px}
.topbar a{color:#e9d5ff;font-family:'JetBrains Mono',monospace;font-size:13px;text-decoration:none}
.card{max-width:860px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 25px 60px rgba(2,6,23,.3);overflow:hidden}
.hd{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:26px 32px}
.hd h1{font-size:24px;margin-bottom:4px}
.hd p{opacity:.9;font-size:14px}
.bd{padding:30px 32px}
/* start */
.lead{font-size:15px;color:#475569;margin-bottom:20px;line-height:1.7}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
.mode{border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:.18s;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}
.mode:hover{border-color:var(--p);background:#eef2ff;transform:translateY(-2px)}
.mode b{font-size:15px}
.mode .n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.mode.full{grid-column:1/3;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none}
.mode.full .n{background:rgba(255,255,255,.2);color:#fff;border:none}
.best{margin-top:16px;font-size:13px;color:var(--muted);text-align:center}
/* quiz */
.bar{height:8px;background:#eef2ff;border-radius:10px;overflow:hidden;margin-bottom:6px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);width:0;transition:.3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:18px}
.cat-tag{display:inline-block;font-size:12px;color:#4338ca;background:#eef2ff;border:1px solid #c7d2fe;border-radius:20px;padding:3px 12px;margin-bottom:12px}
.q{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:14px}
pre{background:#0b1020;color:#e2e8f0;padding:14px 16px;border-radius:10px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.6;margin-bottom:16px;white-space:pre}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:'Lora',serif;font-size:15px;background:#fff;transition:.15s;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--p);background:#f5f7ff}
.opt .lab{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--p);flex-shrink:0}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:#f0fdf4}
.opt.correct .lab{color:var(--ok)}
.opt.wrong{border-color:var(--no);background:#fef2f2}
.opt.wrong .lab{color:var(--no)}
.exp{margin-top:16px;border-radius:12px;padding:16px 18px;font-size:14.5px;line-height:1.7;display:none}
.exp.show{display:block}
.exp.ok{background:#f0fdf4;border-left:4px solid var(--ok)}
.exp.no{background:#fef2f2;border-left:4px solid var(--no)}
.exp b{color:#4338ca}
.nav{margin-top:20px;text-align:right}
.btn{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;padding:12px 28px;border-radius:30px;font-family:'Lora',serif;font-weight:700;font-size:15px;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(99,102,241,.4)}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--p)}
/* result */
.res{text-align:center}
.score-big{font-size:60px;font-weight:800;font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,#6366f1,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grade{font-size:22px;font-weight:800;margin:6px 0}
.res p{color:var(--muted);margin-bottom:20px}
.review{text-align:left;margin-top:24px}
.review h3{font-size:16px;margin-bottom:12px;color:var(--no)}
.ri{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:14px;line-height:1.6}
.ri .qq{font-weight:700;margin-bottom:6px}
.ri .aa{color:#16a34a}
.res-btns{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
@media(max-width:620px){.modes{grid-template-columns:1fr}.mode.full{grid-column:auto}}
</style>
</head>

    <h1>🧠 개발보안 실력 점검 퀴즈</h1>
    <p>소프트웨어 보안약점 진단가이드 7대 유형 + 설계·일반 — 총 40문항</p>
  </div>
  <div class="bd" id="bd"></div>
</div>

<script>
// ===== 문제 은행 =====
const BANK = [
// 입력데이터 검증 및 표현
{c:'입력검증',q:'SQL 인젝션을 막는 가장 근본적이고 권장되는 방법은?',o:['입력값 길이를 제한한다','파라미터화 쿼리(PreparedStatement)를 사용한다','특수문자를 화면에서 숨긴다','HTTPS로 전송한다'],a:1,e:'입력값을 명령(SQL)과 분리하는 파라미터 바인딩이 근본 대책입니다. 길이 제한·인코딩은 보조 수단일 뿐입니다.'},
{c:'입력검증',q:'다음 코드의 보안약점은?',code:'String sql = "SELECT * FROM users WHERE id = \'" + userId + "\'";\nstmt.execute(sql);',o:['크로스사이트 스크립트','SQL 인젝션','경로 조작','정수 오버플로우'],a:1,e:'외부 입력 userId를 문자열로 직접 결합해 질의 구조가 변조될 수 있습니다(SQL 인젝션). PreparedStatement로 바꿔야 합니다.'},
{c:'입력검증',q:'저장형/반사형 XSS를 막는 핵심 조치는?',o:['입력을 DB에 암호화 저장','출력 시 컨텍스트에 맞는 인코딩/이스케이프','쿠키 만료시간 단축','HTTP 메서드 제한'],a:1,e:'XSS는 데이터가 HTML/JS로 해석돼 발생하므로, 출력되는 위치(컨텍스트)에 맞게 인코딩하는 것이 핵심입니다.'},
{c:'입력검증',q:'경로 조작(Path Traversal, ../)을 막는 올바른 설계는?',o:['파일명을 대문자로 변환','경로를 정규화한 뒤 허용된 기준 디렉토리 내부인지 검증','파일 크기를 제한','확장자를 .txt로 고정'],a:1,e:'입력 경로를 정규화(canonical)한 후 기준 디렉토리를 벗어나지 않는지 검증해야 ../ 를 통한 이탈을 막습니다.'},
{c:'입력검증',q:'파일 업로드로 인한 웹쉘 실행을 막는 방법이 아닌 것은?',o:['확장자·MIME 화이트리스트 검증','업로드 파일을 웹 실행경로(웹루트) 밖에 저장','저장 폴더의 실행권한 제거','업로드 파일명을 사용자 입력 그대로 사용'],a:3,e:'사용자 입력 파일명을 그대로 쓰면 경로조작·덮어쓰기 위험이 커집니다. 임의 식별자로 저장해야 합니다.'},
{c:'입력검증',q:'SSRF(서버측 요청 위조)의 올바른 대응은?',o:['모든 외부 이미지 차단','요청 대상 도메인 화이트리스트 + 내부 IP 대역 차단','클라이언트에서 URL 검증','요청을 GET으로만 허용'],a:1,e:'서버가 임의 주소로 요청하지 못하도록 허용 목록과 내부망(메타데이터 IP 등) 차단을 서버측에 둬야 합니다.'},
{c:'입력검증',q:'XXE(XML 외부 엔터티) 취약점의 핵심 대응은?',o:['XML을 JSON으로 변환','XML 파서에서 외부 엔터티·DTD 처리를 비활성화','XML 파일 크기 제한','XML을 압축 전송'],a:1,e:'외부 엔터티/DTD를 비활성화하면 내부 파일 노출·SSRF로 이어지는 XXE를 차단할 수 있습니다.'},
// 보안기능
{c:'보안기능',q:'비밀번호를 안전하게 저장하는 방법은?',o:['MD5 해시','평문 + 접근통제','솔트를 더한 적응형 해시(bcrypt/Argon2)','Base64 인코딩'],a:2,e:'사용자별 솔트와 연산비용이 조절되는 적응형 해시(bcrypt, Argon2, PBKDF2)를 써야 유출 시 대량 크래킹을 막습니다.'},
{c:'보안기능',q:'소스코드에 API 키·비밀번호를 하드코딩하면 안 되는 이유는?',o:['컴파일이 느려진다','소스 유출·디컴파일 시 그대로 노출된다','코드가 길어진다','실행 속도가 느려진다'],a:1,e:'하드코딩된 비밀은 저장소·바이너리에서 추출됩니다. 환경변수·시크릿 매니저·KMS 등 외부 안전저장소를 사용해야 합니다.'},
{c:'보안기능',q:'다음 중 사용을 피해야 할 취약한 암호 알고리즘은?',o:['AES-256','SHA-256','MD5','Argon2'],a:2,e:'MD5·SHA-1·DES는 충돌/해독이 가능해 보안용으로 부적절합니다. AES, SHA-256 이상, Argon2 등을 사용합니다.'},
{c:'보안기능',q:'IDOR(부적절한 인가)를 막는 올바른 방법은?',o:['객체 식별자를 숨긴다(메뉴 비표시)','서버에서 요청자가 해당 객체의 소유자/권한이 있는지 검증','식별자를 1씩 증가시킨다','URL을 암호화한다'],a:1,e:'식별자 추측만 막는 것은 불충분합니다. 모든 접근에서 서버측이 소유권·권한을 검증해야 합니다.'},
{c:'보안기능',q:'보안에 사용할 난수를 생성할 때 올바른 것은?',o:['일반 rand() 사용','시스템 시간을 시드로 사용','암호학적 안전 난수생성기(CSPRNG/SecureRandom)','순차 증가 값 사용'],a:2,e:'토큰·키·세션ID 등 보안용 난수는 예측 불가능해야 하므로 CSPRNG(SecureRandom 등)를 사용합니다.'},
{c:'보안기능',q:'인증 누락(Missing Authentication) 취약점의 예는?',o:['로그인 페이지에 CAPTCHA가 없다','관리자 기능 URL에 직접 접근하면 인증 없이 동작한다','비밀번호가 8자다','세션이 30분 후 만료된다'],a:1,e:'중요기능이 화면에서만 가려져 있고 서버측 인증 검증이 없으면, 직접 URL 접근으로 우회됩니다.'},
{c:'보안기능',q:'무차별 대입(brute force) 공격에 대한 적절한 설계는?',o:['비밀번호를 길게만 요구','로그인 실패 횟수 제한 + 계정 잠금/지연, CAPTCHA','로그를 남기지 않음','쿠키를 자주 갱신'],a:1,e:'실패 임계치·잠금·점증 지연·자동화 차단(CAPTCHA)으로 대량 시도를 막아야 합니다.'},
// 시간 및 상태
{c:'시간상태',q:'TOCTOU(검사-사용 시간차) 경쟁조건의 본질은?',o:['메모리가 부족하다','검사 시점과 사용 시점 사이에 상태가 바뀔 수 있다','암호가 약하다','로그가 많다'],a:1,e:'파일·자원을 검사한 뒤 실제 사용하기까지의 틈에 다른 주체가 상태를 바꾸면 보안 결정이 무력화됩니다. 원자적 처리·락이 필요합니다.'},
{c:'시간상태',q:'외부 입력으로 반복 횟수가 정해지는 루프에서 주의할 점은?',o:['주석을 많이 단다','종료 조건과 입력 범위를 검증해 무한 루프/자원 고갈을 막는다','변수명을 짧게 한다','전역변수를 쓴다'],a:1,e:'제어되지 않는 반복은 CPU 점유로 서비스 거부(DoS)를 유발합니다. 경계·종료 조건을 반드시 검증합니다.'},
// 에러처리
{c:'에러처리',q:'에러 메시지로 인한 정보 노출을 막는 방법은?',o:['사용자에게 상세 스택트레이스 표시','일반화된 메시지만 노출하고 상세는 서버 로그에만 기록','에러를 무시한다','에러코드를 숨긴다'],a:1,e:'스택트레이스·쿼리·경로가 노출되면 공격 단서가 됩니다. 사용자에게는 일반 메시지, 상세는 서버 로그에 남깁니다.'},
{c:'에러처리',q:'올바른 예외처리 설계 원칙은?',o:['모든 예외를 빈 catch로 무시한다','예외 발생 시 안전한 기본동작(거부)과 일관된 처리','예외 내용을 사용자에게 그대로 전달','예외 발생 시 권한을 상승시킨다'],a:1,e:'예외를 삼키거나(빈 catch) 사용자에게 노출하면 위험합니다. 공통 처리 계층에서 안전하게 거부하고 일관되게 처리해야 합니다.'},
// 코드오류
{c:'코드오류',q:'Null 포인터 역참조를 예방하는 방법은?',o:['변수를 전역으로 선언','객체 사용 전 null 여부를 검사','try 없이 호출','캐스팅을 많이 한다'],a:1,e:'반환값·외부 데이터가 null일 수 있으므로 사용 전에 검사하거나 Optional 등을 활용해 역참조를 막습니다.'},
{c:'코드오류',q:'Use-After-Free(해제 후 사용)를 막는 방법은?',o:['메모리를 더 많이 할당','해제 후 포인터를 무효화하고 재사용하지 않는다','전역 버퍼 사용','스레드를 늘린다'],a:1,e:'해제된 메모리를 가리키는 포인터를 다시 쓰면 임의코드 실행으로 이어질 수 있습니다. 해제 후 null 설정·재사용 금지가 필요합니다.'},
{c:'코드오류',q:'안전하지 않은 역직렬화(Deserialization)의 올바른 대응은?',o:['신뢰할 수 없는 데이터를 그대로 역직렬화','신뢰할 수 없는 직렬화 데이터의 역직렬화 금지 또는 허용 클래스 화이트리스트','역직렬화 후 로그 남김','JSON 대신 XML 사용'],a:1,e:'신뢰 불가 데이터의 역직렬화는 객체 주입을 통한 RCE로 이어집니다. 금지하거나 타입 화이트리스트·서명검증을 적용합니다.'},

{c:'설계·일반',q:'세션 고정(Session Fixation) 공격을 막는 설계는?',o:['로그인 성공 시 세션ID를 재발급','쿠키를 평문으로 전송','세션을 영구 유지','세션ID를 URL에 노출'],a:0,e:'로그인 시 새 세션ID를 발급하면 공격자가 미리 심어둔 세션ID가 무효화되어 고정 공격을 막습니다.'},
{c:'설계·일반',q:'세션 쿠키에 적용해야 할 보안 속성으로 옳은 것은?',o:['HttpOnly, Secure, SameSite','Public, Cache, Expires만','Domain만 설정','속성 불필요'],a:0,e:'HttpOnly(JS접근 차단)·Secure(HTTPS 전용)·SameSite(교차사이트 제한)로 탈취·CSRF 위험을 줄입니다.'},
{c:'설계·일반',q:'최소 권한 원칙(Least Privilege)의 의미는?',o:['모두에게 관리자 권한 부여','각 주체에 필요한 최소한의 권한만 부여','권한을 아예 두지 않음','권한을 자주 변경'],a:1,e:'권한을 최소화하면 한 계정이 탈취돼도 피해 범위가 그 권한 내로 제한됩니다.'},
{c:'설계·일반',q:'보안약점을 제거하기에 가장 비용 효율적인 시점은?',o:['운영 배포 후','SDLC 초기(설계·구현 단계)','폐기 직전','사고 발생 후'],a:1,e:'결함은 이른 단계에서 잡을수록 수정 비용이 작습니다. 설계·구현 단계의 시큐어코딩이 가장 효과적입니다.'},

{c:'설계·일반',q:'SW보안약점 진단원 시험에서 2교시(실습)가 주로 평가하는 것은?',o:['타자 속도','소스코드 분석·설계 산출물 검토 등 실무 진단 역량','네트워크 구축','문서 디자인'],a:1,e:'2교시 실습은 실제 진단 업무와 유사하게 소스코드·설계 산출물에서 보안약점을 식별하는 역량을 검증합니다.'},
{c:'설계·일반',q:'"안전한 코드 다운로드(무결성 검증)"가 필요한 이유는?',o:['속도 향상','내려받는 코드·업데이트의 변조(공급망 공격)를 탐지하기 위해','용량 절약','호환성'],a:1,e:'서명·해시로 무결성을 검증하지 않으면 변조된 코드가 정상으로 위장해 실행될 수 있습니다(공급망 위협).'},
];

// ===== 엔진 =====
const bd=document.getElementById('bd');
const CATS=[...new Set(BANK.map(x=>x.c))];
let pool=[],idx=0,score=0,wrong=[],curMode='';

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function bestKey(m){return 'sdq_best_'+m;}
function getBest(m){try{return JSON.parse(localStorage.getItem(bestKey(m))||'null');}catch(e){return null;}}
function setBest(m,pct){const b=getBest(m);if(b==null||pct>b)localStorage.setItem(bestKey(m),JSON.stringify(pct));}

function start(){
  const catBtns=CATS.map(c=>{
    const n=BANK.filter(x=>x.c===c).length;
    return '<div class="mode" onclick="begin(\''+c+'\')"><b>'+c+'</b><span class="n">'+n+'문항</span></div>';
  }).join('');
  bd.innerHTML=
    '<p class="lead">유형을 선택하면 해당 문제들을, <b>전체 도전</b>은 40문항을 무작위 순서로 출제합니다. 각 문항은 풀이 즉시 정답과 해설을 보여줍니다.</p>'+
    '<div class="modes">'+
    '<div class="mode full" onclick="begin(\'전체\')"><b>🎲 전체 도전 (40문항 랜덤)</b><span class="n">ALL</span></div>'+
    catBtns+'</div>'+
    '<div class="best" id="bestLine"></div>';
  const b=getBest('전체');
  document.getElementById('bestLine').textContent = b!=null ? ('전체 도전 최고 기록: '+b+'%') : '아직 기록이 없습니다. 도전해 보세요!';
}

function begin(mode){
  curMode=mode;
  pool = mode==='전체' ? shuffle(BANK) : shuffle(BANK.filter(x=>x.c===mode));
  idx=0;score=0;wrong=[];
  render();
}

function render(){
  const q=pool[idx];
  const pct=Math.round(idx/pool.length*100);
  const opts=q.o.map((t,i)=>
    '<button class="opt" data-i="'+i+'" onclick="answer('+i+')"><span class="lab">'+'ABCD'[i]+'</span><span class="ot"></span></button>'
  ).join('');
  bd.innerHTML=
    '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
    '<div class="meta"><span>문항 '+(idx+1)+' / '+pool.length+'</span><span>점수 '+score+'</span></div>'+
    '<span class="cat-tag">'+q.c+'</span>'+
    '<div class="q"></div>'+
    (q.code?'<pre></pre>':'')+
    '<div class="opts">'+opts+'</div>'+
    '<div class="exp" id="exp"></div>'+
    '<div class="nav" id="nav"></div>';
  bd.querySelector('.q').textContent=q.q;
  if(q.code) bd.querySelector('pre').textContent=q.code;
  // 옵션 텍스트는 textContent로 안전 주입
  bd.querySelectorAll('.opt').forEach((btn,i)=>{btn.querySelector('.ot').textContent=q.o[i];});
}

function answer(i){
  const q=pool[idx];
  const btns=bd.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[q.a].classList.add('correct');
  const ok = i===q.a;
  if(ok){score++;}
  else{btns[i].classList.add('wrong');wrong.push({q:q.q,a:q.o[q.a],e:q.e});}
  const exp=document.getElementById('exp');
  exp.className='exp show '+(ok?'ok':'no');
  exp.textContent=(ok?'✅ 정답입니다! ':'❌ 오답입니다. 정답: '+'ABCD'[q.a]+'. ')+q.e;
  const nav=document.getElementById('nav');
  const last=idx===pool.length-1;
  const btn=document.createElement('button');
  btn.className='btn';btn.textContent=last?'결과 보기':'다음 문제 →';
  btn.onclick=()=>{ if(last){result();}else{idx++;render();} };
  nav.appendChild(btn);
}

function result(){
  const total=pool.length, pct=Math.round(score/total*100);
  setBest(curMode,pct);
  let grade,msg;
  if(pct>=90){grade='🏆 보안 마스터';msg='탁월합니다! 실무 진단 역량이 충분합니다.';}
  else if(pct>=70){grade='👍 우수';msg='잘하고 있어요. 틀린 부분만 보완하면 완벽합니다.';}
  else if(pct>=50){grade='📚 보통';msg='기초는 갖췄습니다. 해설을 복습해 보세요.';}
  else{grade='🌱 입문';msg='학습 포털의 실습부터 차근차근 익혀 보세요.';}
  let rev='';
  if(wrong.length){
    rev='<div class="review"><h3>📝 틀린 문제 복습 ('+wrong.length+')</h3>'+
      wrong.map(w=>'<div class="ri"><div class="qq"></div><div class="aa"></div><div class="ee"></div></div>').join('')+'</div>';
  }
  bd.innerHTML='<div class="res"><div class="score-big">'+pct+'%</div><div class="grade">'+grade+'</div>'+
    '<p>'+total+'문항 중 <b>'+score+'문항</b> 정답 · '+msg+'</p>'+rev+
    '<div class="res-btns"><button class="btn" onclick="begin(\''+curMode+'\')">다시 풀기</button>'+
    '<button class="btn ghost" onclick="start()">다른 유형 선택</button>'+
    '<button class="btn ghost" onclick="location.href=\'secure-dev-portal.html\'">포털로</button></div></div>';
  // 복습 내용 안전 주입
  const ris=bd.querySelectorAll('.ri');
  wrong.forEach((w,i)=>{
    ris[i].querySelector('.qq').textContent='Q. '+w.q;
    ris[i].querySelector('.aa').textContent='정답: '+w.a;
    ris[i].querySelector('.ee').textContent='해설: '+w.e;
  });
}

start();
</script>
