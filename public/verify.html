<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const CERT_HASH_PREFIX = 'SDA-CERT-v1';
function certCanonical(c){
  // certificate.html 의 certCanonical 과 반드시 동일한 순서/접두.
  return [CERT_HASH_PREFIX, c.name, c.certId, c.date, c.level, c.xp, c.concepts, c.practical].join('|');
}
// ── F4 스킬 자격(skill-assess.html 발급) — 필드·순서 동일하게 유지 ──
const SKILL_HASH_PREFIX = 'WVS-ASSESS-v1';
const AXLBL = {inj:'인젝션',xss:'XSS·출력',auth:'인증·세션',authz:'접근통제',cry:'암호화',rob:'안정성',cfg:'구성·보호',ai:'AI 보안'};
const TIERS = ['입문','발전','숙련','전문가'];
function isSkill(c){ return c && (c.t === 'WVS-SKILL' || String(c.certId||'').indexOf('WVS-SKILL-') === 0); }
function skillCanonical(c){
  return [SKILL_HASH_PREFIX, c.name, c.certId, c.date, c.score, c.pct, c.tier, c.axes, c.dur, c.flags].join('|');
}
function canonicalOf(c){ return isSkill(c) ? skillCanonical(c) : certCanonical(c); }
function renderSkill(verdict, cls, title, sub, cred, onlineBadge){
  const out = document.getElementById('result');
  let html = '<div class="verdict '+cls+'"><div class="ic">'+verdict+'</div><div><h2>'+title+'</h2><p>'+sub+'</p></div></div>';
  if (cred){
    const m = Math.floor((+cred.dur||0)/60), s = (+cred.dur||0)%60;
    const flags = (+cred.flags||0);
    const tier = TIERS[Math.max(0,Math.min(3,+cred.tier||0))];
    const axes = String(cred.axes||'').split(',').filter(Boolean).map(p => {
      const i = p.indexOf(':');
      const k = i > 0 ? p.slice(0, i) : p;
      return '<span class="badge">'+esc(AXLBL[k]||k)+' '+(i > 0 ? (parseInt(p.slice(i+1),10)||0) : '')+'</span>';
    }).join(' ');
    html += '<div class="card">'+
      '<div class="name">'+esc((cred.name||'').split('').join(' '))+'</div>'+
      (onlineBadge?'<div style="text-align:center;margin-bottom:12px">'+onlineBadge+'</div>':'')+
      '<div class="grid">'+
        '<div><div class="k">자격번호 / Skill ID</div><div class="val">'+esc(cred.certId)+'</div></div>'+
        '<div><div class="k">발급일자 / Date</div><div class="val">'+esc(cred.date)+'</div></div>'+
        '<div><div class="k">종합 점수 / Score</div><div class="val">'+esc(cred.score)+' / 100</div></div>'+
        '<div><div class="k">추정 백분위 / Percentile</div><div class="val">P'+esc(cred.pct)+'</div></div>'+
        '<div><div class="k">등급 / Tier</div><div class="val">'+esc(tier)+'</div></div>'+
        '<div><div class="k">소요 / Duration</div><div class="val">'+m+'분 '+s+'초</div></div>'+
      '</div>'+
      '<div style="margin-top:12px"><div class="k" style="font-size:12px;color:#94a3b8;margin-bottom:6px">8축 역량 점수 / Axis scores</div>'+axes+'</div>'+
      '<div style="margin-top:8px;font-size:12px;color:'+(flags?'#fde68a':'#86efac')+'">'+(flags?('⚠ 시험 중 탭 전환 '+flags+'회 기록됨'):'✓ 무결성 플래그 없음')+'</div>'+
      '<div class="hash">SHA-256: '+esc(cred.hash||'')+'</div>'+
    '</div>';
  }
  out.innerHTML = html;
}
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function b64urlDecode(s){
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return decodeURIComponent(escape(atob(s)));
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 온라인 등록 대조(진위) — 미등록/오프라인이면 무결성만 표시하는 기본 결과 반환
/* [QA N-02] 이 페이지는 URL 에 담긴 데이터를 다시 해싱해 첨부 해시와 비교했고,
 * 일치하면 "무결성 확인됨 · 위·변조 없음" 이라고 적었다. 비밀 키가 없으므로
 * 이름을 바꾸고 해시를 다시 계산하면 똑같이 통과한다 — 보증하지 못하는 것을 보증한다고 말한 것이다.
 * 실제 보증 수준은 세 가지뿐이라 문구를 거기에 맞춘다.
 *   1) 서버 기록 + 서명 유효 → 발급 확인됨
 *   2) 서버 기록은 있으나 서명이 없거나(구버전) 내용이 다름 → 확인 불가/불일치
 *   3) 서버 기록 없음 → 발급 사실 미확인 (링크 자체가 앞뒤로 맞다는 것까지만 참) */
async function checkOnline(id, cert, h){
  const skill = isSkill(cert);
  const noun = skill ? '자격' : '수료증';
  const unverified = {
    ic:'🔎', cls:'v-warn', title:'발급 사실 미확인',
    sub:'이 링크는 앞뒤가 맞습니다(링크 안의 내용과 첨부 값이 일치). 다만 그것만으로는 '+noun+' 발급 사실을 증명하지 못합니다. 링크를 만든 사람은 내용을 바꾸고 값을 다시 계산할 수 있습니다. 서버 기록에서 확인되지 않았습니다.',
    onlineBadge:'<span class="badge">🔎 발급 사실 미확인 (링크 자체 일치)</span>'
  };
  let rec = null;
  try { rec = await fetchCert(id || cert.certId); } catch(e){ return unverified; }
  if (!rec) return unverified;

  if (rec.legacy) {
    return { ic:'⚠️', cls:'v-warn', title:'서버가 보증하지 않는 기록',
      sub:'같은 번호의 기록이 서버에 있으나 서버 서명이 없습니다(구버전 자가 기록). 공식 검증 대상이 아닙니다.',
      onlineBadge:'<span class="badge" style="background:#241a05;color:#fde68a;border-color:#5b4708">⚠ 서버 서명 없음</span>' };
  }
  if (rec.verified) {
    const masked = (rec.cert && rec.cert.name) ? ' · '+esc(rec.cert.name) : '';
    return { ic:'✅', cls:'v-ok', title:'발급 확인됨 (서버 기록)',
      sub:'서버가 발급하고 자기 키로 서명한 '+noun+'입니다. 서버 기록의 명의'+masked+'가 받으신 '+noun+'과 같은지 확인하세요.',
      onlineBadge:'<span class="badge online">☁ 발급 확인됨 (서버 기록)</span>' };
  }
  return { ic:'⚠️', cls:'v-warn', title:'서명 검증 실패',
    sub:'같은 번호의 서버 기록이 있으나 서명이 내용과 맞지 않습니다. 최신 발급 링크인지 확인하세요.',
    onlineBadge:'<span class="badge" style="background:#241a05;color:#fde68a;border-color:#5b4708">⚠ 서명 불일치</span>' };
}

function render(verdict, cls, title, sub, cert, onlineBadge){
  const out = document.getElementById('result');
  let html = '<div class="verdict '+cls+'"><div class="ic">'+verdict+'</div><div><h2>'+title+'</h2><p>'+sub+'</p></div></div>';
  if (cert){
    html += '<div class="card">'+
      '<div class="name">'+esc((cert.name||'').split('').join(' '))+'</div>'+
      (onlineBadge?'<div style="text-align:center;margin-bottom:12px">'+onlineBadge+'</div>':'')+
      '<div class="grid">'+
        '<div><div class="k">수료번호 / Cert No.</div><div class="val">'+esc(cert.certId)+'</div></div>'+
        '<div><div class="k">이수일자 / Date</div><div class="val">'+esc(cert.date)+'</div></div>'+
        '<div><div class="k">레벨 / Level</div><div class="val">Lv.'+esc(cert.level)+'</div></div>'+
        '<div><div class="k">경험치 / XP</div><div class="val">'+esc(cert.xp)+'</div></div>'+
        '<div><div class="k">이수 개념 / Concepts</div><div class="val">'+esc(cert.concepts)+'</div></div>'+
        '<div><div class="k">실습 통과 / Practicals</div><div class="val">'+esc(cert.practical)+'</div></div>'+
      '</div>'+
      '<div class="hash">SHA-256: '+esc(cert.hash||'')+'</div>'+
    '</div>';
  }
  out.innerHTML = html;
}

const CERT_API = 'https://us-central1-vuln-sim.cloudfunctions.net/certApi';

/* 서버 발급·서명 수료증(WVS-VC-…) — 서버가 권위 있는 판정을 내린다.
   클라이언트가 만든 해시를 재계산하는 방식과 달리, 이 경로는 서버 비밀키 HMAC 서명을
   서버가 직접 검증하므로 페이로드를 고쳐도 통과시킬 수 없다. */
async function renderServerVerified(id){
  const out = document.getElementById('result');
  let r;
  try {
    const res = await fetch(CERT_API + '?action=verify&id=' + encodeURIComponent(id));
    r = await res.json();
  } catch (e) {
    render('⚠️','v-warn','검증 서버에 연결할 수 없음','잠시 후 다시 시도해 주세요. (서버 검증 수료증은 온라인 확인이 필요합니다)', null);
    return true;
  }
  if (!r || !r.ok) { render('⚠️','v-warn','검증 실패','서버가 검증 결과를 반환하지 않았습니다.', null); return true; }
  if (!r.found) {
    render('❌','v-bad','발급 기록 없음','이 번호로 발급된 수료증이 서버에 존재하지 않습니다. 위조되었거나 잘못된 링크입니다.', null);
    return true;
  }
  if (r.legacy || !r.cert || r.verified === undefined) {
    render('⚠️','v-warn','자가 보고 기록','서버가 채점·서명하지 않은 자가 학습 기록입니다. 공식 검증 대상이 아닙니다.',
      { name: (r.cert&&r.cert.name)||'', certId: (r.cert&&r.cert.certId)||id, date: (r.cert&&r.cert.issuedAt)||'', level:'-', xp:'-', concepts:'-', practical:'-', hash:'' },
      '<span class="badge" style="background:#241a05;color:#fde68a;border-color:#5b4708">⚠ 미검증(자가 보고)</span>');
    return true;
  }
  const c = r.cert;
  const okBadge = '<span class="badge online">🔐 서버 채점 · 서명 검증됨</span>';
  const badBadge = '<span class="badge" style="background:#2a1015;color:#fca5a5;border-color:#5b1a22">✗ 서명 불일치</span>';
  const html = '<div class="verdict ' + (r.verified?'v-ok':'v-bad') + '"><div class="ic">' + (r.verified?'✅':'❌') + '</div><div><h2>' +
    (r.verified?'검증 완료 — 서버 발급 수료증':'위·변조 감지') + '</h2><p>' +
    (r.verified
      ? '이 수료증은 서버가 직접 채점하고 서버 비밀키로 서명해 발급한 정식 기록입니다.'
      : '서버에 저장된 내용과 서명이 일치하지 않습니다. 신뢰할 수 없습니다.') +
    '</p></div></div>' +
    '<div class="card"><div class="name">' + esc((c.name||'').split('').join(' ')) + '</div>' +
    '<div style="text-align:center;margin-bottom:12px">' + (r.verified?okBadge:badBadge) + '</div>' +
    '<div class="grid">' +
      '<div><div class="k">수료번호 / Cert No.</div><div class="val">' + esc(c.certId) + '</div></div>' +
      '<div><div class="k">발급일자 / Issued</div><div class="val">' + esc(String(c.issuedAt||'').slice(0,10)) + '</div></div>' +
      '<div><div class="k">점수 / Score</div><div class="val">' + esc(c.score) + ' 점</div></div>' +
      '<div><div class="k">정답 / Correct</div><div class="val">' + esc(c.correct) + ' / ' + esc(c.total) + '</div></div>' +
      '<div><div class="k">시험판 / Exam</div><div class="val">' + esc(c.examVersion||'') + '</div></div>' +
      '<div><div class="k">채점 주체 / Grader</div><div class="val">서버(Cloud Functions)</div></div>' +
    '</div></div>';
  out.innerHTML = html;
  return true;
}

(async function(){
  const q = new URLSearchParams(location.search);
  const id = q.get('id'); const d = q.get('d'); const h = q.get('h');

  // 서버 발급 수료증은 페이로드(d/h) 없이 번호만으로 서버가 판정한다.
  if (id && /^WVS-VC-/.test(id)) { await renderServerVerified(id); return; }

  if (!d || !h){
    // No payload — try online lookup by id only.
    if (id){
      const rec = await fetchCert(id);
      if (rec){
        if (String(rec.t||'') === 'WVS-SKILL') renderSkill('✅','v-ok','진위 확인됨 (온라인 등록)','이 자격번호는 발급자가 온라인 등록한 스킬 자격입니다.', rec, '<span class="badge online">☁ 온라인 등록됨</span>');
        else render('✅','v-ok','진위 확인됨 (온라인 등록)','이 수료번호는 발급자가 온라인 등록한 정식 수료증입니다.', rec, '<span class="badge online">☁ 온라인 등록됨</span>');
        return;
      }
    }
    render('❓','v-warn','검증 정보 부족','검증에 필요한 데이터가 없습니다. 수료증/자격의 정식 검증 링크로 다시 시도하세요.', null);
    return;
  }

  let cert;
  try { cert = JSON.parse(b64urlDecode(d)); }
  catch(e){ render('⚠️','v-bad','검증 실패','검증 링크가 손상되었습니다(데이터 해독 불가).', null); return; }

  // Integrity: recompute SHA-256 over the canonical payload (credential type aware).
  const recomputed = await sha256Hex(canonicalOf(cert));
  const integrityOk = (recomputed === h) && (recomputed === (cert.hash||h));

  if (!integrityOk){
    const tampered = { ...cert, hash: recomputed };
    const badge = '<span class="badge" style="background:#2a1015;color:#fca5a5;border-color:#5b1a22">✗ 해시 불일치</span>';
    if (isSkill(cert)) renderSkill('❌','v-bad','위·변조 감지','이 검증 링크의 내용이 발급 당시와 일치하지 않습니다. 신뢰할 수 없는 자격입니다.', tampered, badge);
    else render('❌','v-bad','위·변조 감지','이 검증 링크의 내용이 발급 당시와 일치하지 않습니다. 신뢰할 수 없는 수료증입니다.', tampered, badge);
    return;
  }

  // Authenticity: cross-check the online registry (best-effort).
  const v = await checkOnline(id, cert, h);

  if (isSkill(cert)) renderSkill(v.ic, v.cls, v.title, v.sub, cert, v.onlineBadge);
  else render(v.ic, v.cls, v.title, v.sub, cert, v.onlineBadge);

  async function _noop(){}
})();

/* [QA N-04] 예전에는 브라우저가 certificates 문서를 직접 읽었다.
 * 그래서 보안 규칙이 무인증 단건 조회를 열어 둬야 했고, 문서에 실명이 그대로 있어
 * 수료번호를 훑는 것만으로 이름을 모을 수 있었다.
 * 이제 공개 검증 API 만 부른다. 서버는 이름을 가려서(홍*동) 돌려준다. */
async function fetchCert(id){
  try{
    const res = await fetch(CERT_API + '?action=verify&id=' + encodeURIComponent(String(id)), { method: 'GET' });
    if(!res.ok) return null;
    const j = await res.json();
    if(!j || !j.ok || !j.found) return null;
    return { _api: true, verified: !!j.verified, legacy: !!j.legacy, cert: j.cert || {} };
  }catch(e){ return null; }
}
window.fetchCert = fetchCert;
</script>
