  <div class="panel">
    <h2>🏫 강의실 입장 (클래스 동기화)</h2>
    <p>강사가 제공한 6자리 참여 코드를 입력하여 보안 약점 훈련 수업에 참여합니다.</p>

    <!-- Joined Class info -->
    <div class="status-box" id="activeClassBox">
      <h4 style="font-weight:800; color:#a5b4fc; text-align:center; font-size:16px;" id="activeClassName">수업중인 클래스명</h4>
      <div style="font-size:13px; text-align:center; color:var(--text-muted); margin-top:4px;">
        상태: <span style="color:var(--ok); font-weight:700;">실시간 동기화 활성화됨 ✓</span>
      </div>
      <div style="border-top:1px solid var(--border); padding-top:12px; margin-top:12px; font-size:13px;">
        • 현재 학생 진도(XP 및 리포트 데이터)가 강사 화면에 실시간 업로드됩니다.<br>
        • 오프라인 강의실 및 온라인 평가에서 피드백을 실시간으로 확인받을 수 있습니다.
      </div>
    </div>

    <!-- Join Form -->
    <div id="joinForm">
      <div class="form-group">
        <label for="classCodeInput">참여 코드 (예: CL-101)</label>
        <input type="text" id="classCodeInput" placeholder="CL-000" maxlength="8">
      </div>
      <button class="btn" onclick="joinClass()">클래스 참여하기</button>
    </div>

    <button class="btn leave" id="leaveBtn" style="display: none;" onclick="leaveClass()">클래스 퇴장하기</button>
  </div>

<script src="js/academy-state.js"></script>
<script type="module" src="auth-widget.js"></script>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBaRXs5HJ1ABFcshaTpqNj-uFuq2H9ZOcw",
  authDomain: "vuln-sim.firebaseapp.com",
  projectId: "vuln-sim",
  storageBucket: "vuln-sim.firebasestorage.app",
  messagingSenderId: "493267417608",
  appId: "1:493267417608:web:a76ea57fcd71185ae86fbd"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;

onAuthStateChanged(auth, u => {
  currentUser = u;
  renderClassState();
});

function renderClassState() {
  const currentClass = AcademyState.getActiveClass();
  const box = document.getElementById('activeClassBox');
  const form = document.getElementById('joinForm');
  const leave = document.getElementById('leaveBtn');

  if (currentClass) {
    box.style.display = 'block';
    form.style.display = 'none';
    leave.style.display = 'block';
    document.getElementById('activeClassName').textContent = `${currentClass.className} (${currentClass.classCode})`;
    
    // Automatically upload stats to class roster if logged in
    syncProgressWithClass(currentClass.classCode);
  } else {
    box.style.display = 'none';
    form.style.display = 'block';
    leave.style.display = 'none';
  }
}

async function syncProgressWithClass(classCode) {
  if (!currentUser) return;
  const p = AcademyState.getProgress();
  const notes = AcademyState.getWrongNotes();
  const conceptsCount = Object.keys(p.completedConcepts || {}).length;
  const practicalCount = Object.keys(p.completedPractical || {}).length;
  const wrongCount = Object.values(notes).filter(n => !n.mastered).length;

  try {
    const q = query(collection(db, 'classes'), where('joinCode', '==', classCode));
    const snap = await getDocs(q);
    if (!snap.empty) {
      const classDoc = snap.docs[0];
      const memberRef = doc(db, 'classes', classDoc.id, 'members', currentUser.uid);
      await setDoc(memberRef, {
        displayName: currentUser.displayName || currentUser.email || '익명 학생',
        xp: p.xp || 0,
        level: p.level || 1,
        conceptsCount: conceptsCount,
        practicalCount: practicalCount,
        wrongCount: wrongCount,
        updatedAt: new Date().toISOString()
      }, { merge: true });
    }
  } catch (e) {
    console.error('Error syncing progress with class:', e);
  }
}

window.joinClass = async function() {
  const code = document.getElementById('classCodeInput').value.trim().toUpperCase();
  if (!code) {
    alert('참여 코드를 입력하세요.');
    return;
  }

  try {
    const q = query(collection(db, 'classes'), where('joinCode', '==', code));
    const snap = await getDocs(q);
    if (snap.empty) {
      alert('유효하지 않은 클래스 참여 코드입니다. 다시 확인해 주십시오.');
      return;
    }

    const classData = snap.docs[0].data();
    AcademyState.setActiveClass({
      classCode: code,
      className: classData.title || '보안 훈련 클래스',
      joinedAt: new Date().toISOString()
    });

    AcademyState.showToast(`🏫 클래스에 참가하였습니다: ${classData.title}`);
    renderClassState();
  } catch (e) {
    console.error('Error joining class:', e);
    alert('오류가 발생했습니다. 로그인이 되었는지 먼저 확인하세요.');
  }
};

window.leaveClass = function() {
  if (confirm('클래스에서 퇴장하시겠습니까? 강사 관리 화면에서 본인 정보가 더 이상 집계되지 않습니다.')) {
    AcademyState.setActiveClass(null);
    renderClassState();
    AcademyState.showToast('클래스에서 퇴장하였습니다.');
  }
};
</script>
