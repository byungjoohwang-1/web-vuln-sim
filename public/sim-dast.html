function mockServer(req){

    'Content-Type':'text/html; charset=utf-8',

    return {status:status, reason:reason, headers:headers, body:body||'', time:t0};

  if(path==='/' ){
    return R(200,'OK',
      '<html><head><title>vuln-shop</title></head><body>\n'+

    if(/or\s+'?1'?='?1/i.test(id)){

      return R(200,'OK','<html><body><h2>All products (filter bypassed)</h2>\n'+all+'</body></html>');

  if(path==='/login'){

    var b = parseQuery(req.body||'');

  if(path==='/ping'){

      var injected = host.split(/[;|&]|\$\(|`/).slice(1).join(' ').replace(/\)$/,'').trim();

  if(path==='/download'){

function parseQuery(s){
  var o={}; (s||'').replace(/^[?&]/,'').split('&').forEach(function(kv){
    if(!kv) return; var i=kv.indexOf('='); var k=i<0?kv:kv.slice(0,i); var v=i<0?'':kv.slice(i+1);
    try{o[decodeURIComponent(k)]=decodeURIComponent(v.replace(/\+/g,' '));}catch(e){o[k]=v;}
  });
  return o;
}

/* ============================ request/response text ============================ */
function rawRequest(req){
  var line = req.method+' '+req.path+(req.query?('?'+req.query):'')+' HTTP/1.1';
  var hd = ['Host: '+req.host];
  for(var k in (req.headers||{})) hd.push(k+': '+req.headers[k]);
  return line+'\n'+hd.join('\n')+'\n\n'+(req.body||'');
}
function rawResponse(res){
  var hd=[]; for(var k in res.headers) hd.push(k+': '+res.headers[k]);
  return 'HTTP/1.1 '+res.status+' '+res.reason+'\n'+hd.join('\n')+'\n\n'+res.body;
}
function parseRaw(text){
  var parts = text.split(/\n\r?\n/);
  var head = parts[0].split('\n');
  var body = parts.slice(1).join('\n\n');
  var m = (head[0]||'').match(/^(\w+)\s+(\S+)\s+HTTP/);
  var method = m?m[1]:'GET', target = m?m[2]:'/';
  var path=target, query='';
  var qi = target.indexOf('?'); if(qi>=0){path=target.slice(0,qi);query=target.slice(qi+1);}
  var headers={}, host='vuln-shop.local';
  head.slice(1).forEach(function(h){var i=h.indexOf(':'); if(i<0)return; var k=h.slice(0,i).trim(),v=h.slice(i+1).trim();
    if(k.toLowerCase()==='host') host=v; else headers[k]=v;});
  return {method:method, host:host, path:path, query:query, headers:headers, body:body};
}
function mkReq(method,path,query,body){
  return {method:method,host:'vuln-shop.local',path:path,query:query||'',
    headers:{'User-Agent':'WVS-DAST/1.0','Accept':'*/*'+ '','Connection':'close',
      'Content-Type':method==='POST'?'application/x-www-form-urlencoded':undefined},
    body:body||''};
}

function sendRequest(req, source){
  var res = mockServer(req);
  history.push({id:++hid, req:req, res:res, source:source||'manual',
    method:req.method, path:req.path+(req.query?('?'+req.query):''), status:res.status, len:res.body.length, mime:(res.headers['Content-Type']||'').split(';')[0]});
  return res;
}

/* ============================ crawl / site map ============================ */
var SEED = ['/','/search?q=test','/product?id=1','/login','/download?file=manual.pdf',
  '/api/account?id=1001','/ping?host=127.0.0.1','/redirect?url=/x','/fetch?url=http://example.com',
  '/admin','/robots.txt','/.git/config','/backup.sql','/import'];
var sitemap={};
function crawl(){
  SEED.forEach(function(t){
    var qi=t.indexOf('?'); var path=qi<0?t:t.slice(0,qi); var query=qi<0?'':t.slice(qi+1);
    var method = (path==='/login'||path==='/import')?'POST':'GET';
    var body = path==='/login'?'user=alice&pass=alice123': (path==='/import'?'<order><item>1</item></order>':'');
    var req = mkReq(method,path,query,body);
    var res = sendRequest(req,'crawl');
    sitemap[path]=sitemap[path]||[]; sitemap[path].push({req:req,res:res});
  });
}

function buildTabs(){
  var bar=el('tabbar'); bar.innerHTML='';
  TABS.forEach(function(t){
    var b=document.createElement('button'); b.className=(t.id===active?'on':''); b.id='tab-'+t.id;
    var cnt = t.id==='scanner'&&findings.length? '<span class="cnt">'+findings.length+'</span>'

    intruder:renderIntruder,scanner:renderScanner,decoder:renderDecoder})[active]();

function intLoad(kind){
  var P={ sqli:"1\n1'\n1' OR '1'='1\n1 UNION SELECT 1,2,3\n1; DROP TABLE users--\nadmin'--",
    xss:"test\n<script>alert(1)<\\/script>\n\"><svg onload=alert(1)>\n'><img src=x onerror=alert(1)>",
    trav:"manual.pdf\n../../../../etc/passwd\n..%2f..%2f..%2fetc%2fpasswd\n....//....//etc/passwd",
    creds:"123456\npassword\nadmin\nletmein\nqwerty\nS3cr3t!Admin" };
  el('intPay').value=P[kind]; intruder.payloads=P[kind];
}
function intStart(){
  intruder.template=el('intTpl').value; intruder.payloads=el('intPay').value;
  var tpl=intruder.template; var m=tpl.match(/§([^§]*)§/);
  if(!m){ el('v-intruder'); alert(L('템플릿에 §위치§ 표시가 없습니다.','No §position§ marker in template.')); return; }
  var pays=intruder.payloads.split('\n').filter(function(x){return x.length;});
  var baseLen=null; intruder.results=[];
  pays.forEach(function(pl){
    var raw=tpl.replace(/§[^§]*§/, pl);
    var req=parseRaw(raw); var res=sendRequest(req,'intruder');
    if(baseLen===null) baseLen=res.body.length;
    var flag='';
    if(res.status>=500||/SQL error|syntax/i.test(res.body)) flag='SQL error';
    else if(/uid=0\(root\)|root:x:0:0/.test(res.body)) flag=L('명령/파일 유출','cmd/file leak');
    else if(/auth":"ok".*admin|SQLi auth bypass/.test(res.body)) flag=L('인증 우회','auth bypass');
    else if(res.status===200 && baseLen!==null && Math.abs(res.body.length-baseLen)>40) flag=L('길이 이상','len anomaly');
    intruder.results.push({payload:pl, status:res.status, len:res.body.length, time:res.time, flag:flag, raw:rawResponse(res)});
  });
  renderIntruder();
  el('intDetail').textContent=L('완료: ','done: ')+pays.length+L(' 요청','requests');
}
function intShow(i){ el('intDetail').className=''; el('intDetail').textContent=intruder.results[i].raw; }

    var hit=c.det(res);
    var evReq=req, evRes=res;
    if(!hit && c.reqU){ var r2=c.reqU(); var s2=sendRequest(r2,'scanner'); if(/admin|:S3cr3t|root:x/.test(s2.body)){hit=true;evReq=r2;evRes=s2;} }
    if(hit) findings.push({name:c.name,severity:c.sev,confidence:c.conf,cwe:c.cwe,
      host:'vuln-shop.local',path:req.path,req:rawRequest(evReq),res:rawResponse(evRes),rem:c.rem});
  });
  var order={High:0,Medium:1,Low:2,Info:3};
  findings.sort(function(a,b){return order[a.severity]-order[b.severity];});
  selFinding=0; buildTabs(); renderScanner();
}
function renderScanner(){
  var list = findings.length? findings.map(function(f,i){
    return '<div class="findrow'+(selFinding===i?' sel':'')+'" style="padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer" onclick="selFinding='+i+';renderScanner()">'+
      '<span class="sev '+f.severity+'">'+f.severity+'</span> <b class="mono">'+esc(f.name)+'</b>'+
      '<div class="legend">'+esc(f.path)+' · '+f.cwe+' · '+L('신뢰도','Confidence')+': '+f.confidence+'</div></div>';
  }).join('') : '<div class="muted" style="padding:20px">'+L('아직 스캔하지 않았습니다.','No scan run yet.')+'</div>';
  var f=findings[selFinding];
  var detail = f? ('<div class="detail">'+
    '<span class="sev '+f.severity+'">'+f.severity+'</span> <b class="mono" style="font-size:14px">'+esc(f.name)+'</b>'+
    '<div class="legend" style="margin:6px 0">'+f.cwe+' · '+f.host+f.path+' · '+L('신뢰도','Confidence')+': '+f.confidence+'</div>'+
    '<h4>'+L('증거 요청','Evidence — request')+'</h4><pre>'+esc(f.req)+'</pre>'+
    '<h4>'+L('증거 응답','Evidence — response')+'</h4><pre>'+esc(f.res.slice(0,900))+'</pre>'+
    '<h4>'+L('대응 방안','Remediation')+'</h4><p>'+esc(L(f.rem.ko,f.rem.en))+'</p>'+
    '</div>') : '<div class="muted" style="padding:20px">'+L('이슈를 선택하세요.','Select an issue.')+'</div>';
  el('v-scanner').innerHTML=
   '<div class="kbar"><button class="btn go" onclick="runScan()">▶ '+L('스캔 실행','Run scan')+'</button>'+
   '<span class="legend">'+L('mock 대상의 모든 엔드포인트를 자동 점검합니다.','Audits every endpoint of the mock target.')+'</span></div>'+
   '<div class="split" style="height:calc(100% - 46px)">'+
   '<div class="pane" style="flex:0 0 340px"><div class="hd">'+L('탐지 이슈','Issues')+' ('+findings.length+')</div><div class="bd" style="padding:0">'+list+'</div></div>'+
   '<div class="pane" style="flex:1"><div class="hd">'+L('이슈 상세','Issue detail')+'</div><div class="bd">'+detail+'</div></div>'+
   '</div>';
}

/* ---------- Decoder ---------- */
function renderDecoder(){
  el('v-decoder').innerHTML=
   '<div class="card"><h3>'+L('인코더 / 디코더','Encoder / Decoder')+'</h3>'+
   '<textarea id="decIn" style="height:120px" oninput="decRun()" placeholder="'+L('변환할 텍스트 입력','enter text to transform')+'">&lt;script&gt;alert(1)&lt;/script&gt;</textarea>'+
   '<div class="kbar" style="margin-top:10px">'+
     ['URL','Base64','HTML','Hex'].map(function(t){return '<button class="btn alt sm" onclick="decDo(\''+t+'\',1)">'+t+' '+L('인코딩','encode')+'</button> <button class="btn alt sm" onclick="decDo(\''+t+'\',0)">'+t+' '+L('디코딩','decode')+'</button>';}).join(' ')+
   '</div>'+
   '<div style="margin-top:10px" class="legend">'+L('결과','Output')+':</div>'+
   '<pre id="decOut" style="background:#0e0c0a;border:1px solid var(--border);border-radius:6px;padding:10px;min-height:70px"></pre>'+
   '</div>';
}
function decDo(type,enc){
  var s=el('decIn').value, out='';
  try{
    if(type==='URL') out= enc? encodeURIComponent(s): decodeURIComponent(s);
    else if(type==='Base64') out= enc? btoa(unescape(encodeURIComponent(s))): decodeURIComponent(escape(atob(s)));
    else if(type==='HTML') out= enc? esc(s): s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    else if(type==='Hex') out= enc? s.split('').map(function(c){return c.charCodeAt(0).toString(16).padStart(2,'0');}).join(' ')
                                  : s.trim().split(/\s+/).map(function(h){return String.fromCharCode(parseInt(h,16));}).join('');
  }catch(e){ out='⚠ '+e.message; }
  el('decOut').textContent=out;
}
function decRun(){ /* live preview hook (optional) */ }

/* ============================ boot ============================ */
window.renderDynamic=function(){ buildTabs(); renderActive(); };
crawl();
applyLang();   // builds tabs + renders active (dashboard)
</script>
