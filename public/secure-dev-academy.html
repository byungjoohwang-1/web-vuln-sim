ion": "count * 64 연산 전에 count를 0~1000으로 제한하므로 결과 최대값이 64000으로 int 범위를 절대 넘지 않습니다. 정수형 오버플로우가 발생할 수 없는 안전한 코드(오탐)입니다."}, {"id": "CD-30", "lang": "Java", "cat": "코드오류", "diff": "상", "title": "예외 발생 가능 구간의 파일 자원 처리 검토", "code": "public String readFirstLine(String path) throws IOException {\n    try (BufferedReader br = new BufferedReader(new FileReader(path))) {\n        String line = br.readLine();\n        if (line == null) {\n            throw new IOException(\"empty file\");\n        }\n        return line.trim();\n    }\n}", "isTruePositive": false, "weaknessName": "", "cwe": "", "reasonKeywords": ["try-with-resources", "자동 close", "예외 시에도 해제", "자원 누수 없음"], "negKw": ["정탐", "close 누락", "해제 누락", "누수 발생"], "safeCode": "", "safeCodeKeywords": [], "explanation": "중간에 IOException을 던지더라도 try-with-resources 구문이 BufferedReader를 자동으로 close하므로 자원 누수가 발생하지 않는 안전한 코드(오탐)입니다."}, {"id": "PC-01", "lang": "Java", "cat": "입력검증", "diff": "하", "title": "게시판 첨부파일 업로드 처리 검토", "code": "public void upload(HttpServletRequest request) throws Exception {\n    MultipartRequest multi = new MultipartRequest(\n        request, savePath, sizeLimit, \"euc-kr\", new DefaultFileRenamePolicy());\n    // 업로드되는 파일명을 검증 없이 그대로 저장에 사용한다.\n    String fileName = multi.getFilesystemName(\"filename\");\n    PreparedStatement pstmt = conn.prepareStatement(SQL);\n    pstmt.setString(6, fileName);\n    pstmt.executeUpdate();\n    Thumbnail.create(savePath + \"/\" + fileName, savePath + \"/s_\" + fileName, 150);\n}", "isTruePositive": true, "weaknessName": "위험한 형식 파일 업로드", "cwe": "CWE-434", "reasonKeywords": ["확장자 검증 없음", "화이트리스트 미적용", "jsp 업로드", "웹쉘"], "negKw": ["경로 조작", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public void upload(HttpServletRequest request) throws Exception {\n    MultipartRequest multi = new MultipartRequest(\n        request, savePath, sizeLimit, \"euc-kr\", new DefaultFileRenamePolicy());\n    String fileName = multi.getFilesystemName(\"filename\");\n    if (fileName != null) {\n        String ext = fileName.substring(fileName.lastIndexOf(\".\") + 1).toLowerCase();\n        // 화이트리스트 방식으로 허용 확장자만 업로드를 허용한다.\n        if (!\"gif\".equals(ext) && !\"jpg\".equals(ext) && !\"png\".equals(ext)) {\n            alertMessage(\"업로드 불가능한 파일입니다.\");\n            return;\n        }\n    }\n}", "safeCodeKeywords": ["lastIndexOf", "toLowerCase", "gif"], "explanation": "업로드 파일의 확장자를 화이트리스트로 검증하지 않으므로 jsp 등 실행 가능한 파일(웹쉘)을 올려 서버에서 코드를 실행시킬 수 있어 위험한 형식 파일 업로드에 취약합니다. 허용 확장자만 통과시켜야 합니다."}, {"id": "PC-02", "lang": "Java", "cat": "입력검증", "diff": "중", "title": "사용자 정보 XML 조회 질의 생성 검토", "code": "public XQResultSequence find(Properties props) throws Exception {\n    String name = props.getProperty(\"name\");\n    // 외부 입력값을 검증 없이 XQuery 표현식에 문자열로 결합한다.\n    String es = \"doc('users.xml')/userlist/user[uname='\" + name + \"']\";\n    XQPreparedExpression expr = conn.prepareExpression(es);\n    return expr.executeQuery();\n}", "isTruePositive": true, "weaknessName": "XML 삽입", "cwe": "CWE-91", "reasonKeywords": ["XQuery", "문자열 결합", "외부 입력", "쿼리 구조 변경", "bindString 미사용"], "negKw": ["XML 외부 개체", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public XQResultSequence find(Properties props) throws Exception {\n    String name = props.getProperty(\"name\");\n    // bindString으로 인자화하여 쿼리 구조 변경을 방지한다.\n    String es = \"doc('users.xml')/userlist/user[uname='$xname']\";\n    XQPreparedExpression expr = conn.prepareExpression(es);\n    expr.bindString(new QName(\"xname\"), name, null);\n    return expr.executeQuery();\n}", "safeCodeKeywords": ["bindString", "$xname", "QName"], "explanation": "외부 입력 name을 XQuery 표현식에 직접 결합하므로 공격자가 쿼리 구조를 변조해 권한 밖 데이터를 조회할 수 있는 XML 삽입에 취약합니다. bindString 등으로 인자를 바인딩해야 합니다."}, {"id": "PC-03", "lang": "Java", "cat": "입력검증", "diff": "중", "title": "회원 등급 변경 요청 처리 로직 검토", "code": "public void updateLevel(HttpServletRequest request) {\n    String id = request.getParameter(\"id\");\n    String level = request.getParameter(\"level\");\n    // 상태를 변경하는 요청이지만 토큰 검증 절차가 없다.\n    memberService.updateLevel(id, level);\n}", "isTruePositive": true, "weaknessName": "크로스사이트 요청 위조(CSRF)", "cwe": "CWE-352", "reasonKeywords": ["CSRF 토큰 없음", "상태 변경 요청", "토큰 검증 누락", "위조 요청"], "negKw": ["XSS", "부적절한 인가", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public void updateLevel(HttpServletRequest request) {\n    HttpSession session = request.getSession();\n    String pToken = request.getParameter(\"param_csrf_token\");\n    String sToken = (String) session.getAttribute(\"SESSION_CSRF_TOKEN\");\n    // 요청 토큰과 세션 토큰이 일치할 때만 처리한다.\n    if (pToken == null || !pToken.equals(sToken)) {\n        throw new SecurityException(\"invalid csrf token\");\n    }\n    String id = request.getParameter(\"id\");\n    String level = request.getParameter(\"level\");\n    memberService.updateLevel(id, level);\n}", "safeCodeKeywords": ["param_csrf_token", "SESSION_CSRF_TOKEN", "equals"], "explanation": "회원 등급 변경이라는 상태 변경 요청을 CSRF 토큰 검증 없이 처리하므로 공격자가 피해자의 인증된 세션으로 위조 요청을 전송해 등급을 변조하는 CSRF에 취약합니다. 세션에 저장한 토큰과 대조해야 합니다."}, {"id": "PC-04", "lang": "Java", "cat": "입력검증", "diff": "중", "title": "요청 파라미터 기반 배열 생성 로직 검토", "code": "public void process(HttpServletRequest request) {\n    String tmp = StringUtil.isNullTrim(request.getParameter(\"slf_msg_param_num\"));\n    // 외부 입력값의 크기를 검증하지 않고 정수로 변환해 사용한다.\n    int param_ct = Integer.parseInt(tmp);\n    // param_ct가 음수가 되면 배열 크기가 음수가 되어 예외가 발생한다.\n    String[] strArr = new String[param_ct];\n}", "isTruePositive": true, "weaknessName": "정수형 오버플로우", "cwe": "CWE-190", "reasonKeywords": ["크기 검증 없음", "Integer.parseInt", "배열 크기", "음수 범위"], "negKw": ["버퍼 오버플로우", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public void process(HttpServletRequest request) {\n    String tmp = StringUtil.isNullTrim(request.getParameter(\"slf_msg_param_num\"));\n    try {\n        int param_ct = Integer.parseInt(tmp);\n        // 음수 등 비정상 값 여부를 검증한 후 사용한다.\n        if (param_ct < 0) {\n            throw new IllegalArgumentException();\n        }\n        String[] strArr = new String[param_ct];\n    } catch (Exception e) {\n        msg_str = \"잘못된 입력(접근) 입니다.\";\n    }\n}", "safeCodeKeywords": ["param_ct < 0", "IllegalArgumentException", "try"], "explanation": "외부 입력값을 크기 검증 없이 정수로 변환해 배열 크기로 사용하므로, 연산 결과가 정수 범위를 넘어 음수가 되면 비정상 배열 생성으로 이어지는 정수형 오버플로우에 취약합니다. 사용 전 범위를 검증해야 합니다."}, {"id": "PC-05", "lang": "Python", "cat": "입력검증", "diff": "하", "title": "비밀번호 초기화 권한 판단 로직 검토", "code": "from django.shortcuts import render\ndef init_password(request):\n    # 쿠키에서 권한 정보를 가져와 보안 결정에 사용한다.\n    role = request.COOKIES['role']\n    request_id = request.POST.get('user_id', '')\n    request_mail = request.POST.get('user_email', '')\n    if role == 'admin':\n        password_init_and_sendmail(request_id, request_mail)\n        return render(request, '/success.html')\n    return render(request, '/failed.html')", "isTruePositive": true, "weaknessName": "보안기능 결정에 사용되는 부적절한 입력값", "cwe": "CWE-807", "reasonKeywords": ["쿠키", "클라이언트 조작 가능", "권한 결정", "신뢰할 수 없는 입력"], "negKw": ["부적절한 인가", "XSS", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "from django.shortcuts import render\ndef init_password(request):\n    # 서버가 관리하는 세션에서 권한 정보를 가져와 결정에 사용한다.\n    role = request.session['role']\n    request_id = request.POST.get('user_id', '')\n    request_mail = request.POST.get('user_email', '')\n    if role == 'admin':\n        password_init_and_sendmail(request_id, request_mail)\n        return render(request, '/success.html')\n    return render(request, '/failed.html')", "safeCodeKeywords": ["request.session", "role", "admin"], "explanation": "관리자 여부라는 보안 결정을 클라이언트가 임의로 조작 가능한 쿠키 값에 의존하므로, role=admin 쿠키를 위조해 권한을 우회할 수 있는 부적절한 입력값 사용 약점에 취약합니다. 서버 측 세션 값으로 판단해야 합니다."}, {"id": "PC-06", "lang": "C", "cat": "입력검증", "diff": "중", "title": "구조체 버퍼로의 문자열 복사 로직 검토", "code": "typedef struct _charvoid {\n    char x[16];\n    void *y;\n    void *z;\n} charvoid;\n\nvoid badCode() {\n    charvoid cv_struct;\n    cv_struct.y = (void *) SRC_STR;\n    /* sizeof(cv_struct) 만큼 복사하여 x 버퍼를 넘어 포인터 y를 덮어쓴다. */\n    memcpy(cv_struct.x, SRC_STR, sizeof(cv_struct));\n    printLine((char *) cv_struct.x);\n}", "isTruePositive": true, "weaknessName": "메모리 버퍼 오버플로우", "cwe": "CWE-120", "reasonKeywords": ["memcpy", "sizeof(cv_struct)", "버퍼 경계 초과", "x[16] 덮어쓰기"], "negKw": ["포맷 스트링", "정수 오버플로우", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "typedef struct _charvoid {\n    char x[16];\n    void *y;\n    void *z;\n} charvoid;\n\nstatic void goodCode() {\n    charvoid cv_struct;\n    cv_struct.y = (void *) SRC_STR;\n    /* 대상 버퍼 크기 sizeof(cv_struct.x)만큼만 복사한다. */\n    memcpy(cv_struct.x, SRC_STR, sizeof(cv_struct.x));\n    /* 문자열 종료를 위해 널 문자를 삽입한다. */\n    cv_struct.x[(sizeof(cv_struct.x) / sizeof(char)) - 1] = '\\0';\n    printLine((char *) cv_struct.x);\n}", "safeCodeKeywords": ["sizeof(cv_struct.x)", "\\0", "memcpy"], "explanation": "복사 크기를 대상 버퍼 x[16]가 아니라 구조체 전체 sizeof(cv_struct)로 지정해 버퍼 경계를 넘어 인접한 포인터 y를 덮어쓰므로 메모리 버퍼 오버플로우에 취약합니다. 대상 버퍼 크기만큼만 복사해야 합니다."}, {"id": "PC-07", "lang": "Java", "cat": "입력검증", "diff": "중", "title": "사용자 입력을 포함한 메시지 출력 로직 검토", "code": "public static void main(String[] args) {\n    Calendar validDate = Calendar.getInstance();\n    validDate.set(2014, Calendar.OCTOBER, 14);\n    // 외부 입력값 args[0]을 포맷 문자열에 직접 결합하여 출력한다.\n    System.out.printf(args[0] + \" did not match! HINT: issued on %1$terd\", validDate);\n}", "isTruePositive": true, "weaknessName": "포맷 스트링 삽입", "cwe": "CWE-134", "reasonKeywords": ["printf", "포맷 문자열", "외부 입력 결합", "정보 노출"], "negKw": ["버퍼 오버플로우", "XSS", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public static void main(String[] args) {\n    Calendar validDate = Calendar.getInstance();\n    validDate.set(2014, Calendar.OCTOBER, 14);\n    // 사용자 입력은 %s 인자로 전달하고 포맷 문자열은 고정한다.\n    System.out.printf(\"%s did not match! HINT: issued on %2$terd\", args[0], validDate);\n}", "safeCodeKeywords": ["%s", "args[0]", "printf"], "explanation": "외부 입력 args[0]을 포맷 문자열 자체에 결합하므로 %x, %1$t 등 변환 지정자를 주입해 내부 메모리·날짜 등 민감 정보를 노출시키는 포맷 스트링 삽입에 취약합니다. 입력은 %s 인자로만 전달해야 합니다."}, {"id": "PC-08", "lang": "Python", "cat": "보안기능", "diff": "하", "title": "시스템 설정 파일 권한 부여 로직 검토", "code": "import os\ndef write_file():\n    # 모든 사용자에게 읽기, 쓰기, 실행 권한을 부여한다.\n    os.chmod('/root/system_config', 0o777)\n    with open(\"/root/system_config\", 'w') as f:\n        f.write(\"your config is broken\")", "isTruePositive": true, "weaknessName": "중요한 자원에 대한 잘못된 권한 설정", "cwe": "CWE-732", "reasonKeywords": ["chmod 0o777", "과도한 권한", "최소 권한 위배", "모든 사용자"], "negKw": ["하드코드된 중요정보", "암호화되지 않은", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "import os\ndef write_file():\n    # 소유자에게만 권한을 부여하고 그 외에는 권한을 주지 않는다.\n    os.chmod('/root/system_config', 0o700)\n    with open(\"/root/system_config\", 'w') as f:\n        f.write(\"your config is broken\")", "safeCodeKeywords": ["0o700", "chmod", "system_config"], "explanation": "중요한 설정 파일에 0o777로 모든 사용자에게 읽기·쓰기·실행 권한을 부여하므로 권한 없는 사용자가 설정을 변조·탈취할 수 있는 잘못된 권한 설정에 취약합니다. 최소 권한 원칙에 따라 소유자 권한(0o700)으로 제한해야 합니다."}, {"id": "PC-09", "lang": "Java", "cat": "보안기능", "diff": "하", "title": "회원 가입 시 비밀번호 저장 로직 검토", "code": "public void register(HttpServletRequest request) throws Exception {\n    String id = request.getParameter(\"id\");\n    String pwd = request.getParameter(\"pwd\");\n    String sql = \"insert into customer(id, pwd) values (?, ?)\";\n    PreparedStatement stmt = con.prepareStatement(sql);\n    stmt.setString(1, id);\n    // 입력받은 비밀번호를 평문 그대로 DB에 저장한다.\n    stmt.setString(2, pwd);\n    stmt.executeUpdate();\n}", "isTruePositive": true, "weaknessName": "암호화되지 않은 중요정보", "cwe": "CWE-311", "reasonKeywords": ["평문 저장", "비밀번호", "암호화 미적용", "DB 노출"], "negKw": ["하드코드된 중요정보", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public void register(HttpServletRequest request) throws Exception {\n    String id = request.getParameter(\"id\");\n    String pwd = request.getParameter(\"pwd\");\n    // 솔트를 포함해 SHA-256 해시로 변환한 후 저장한다.\n    MessageDigest md = MessageDigest.getInstance(\"SHA-256\");\n    md.update(salt);\n    byte[] hashInBytes = md.digest(pwd.getBytes());\n    StringBuilder sb = new StringBuilder();\n    for (byte b : hashInBytes) {\n        sb.append(String.format(\"%02x\", b));\n    }\n    pwd = sb.toString();\n    PreparedStatement stmt = con.prepareStatement(\"insert into customer(id, pwd) values (?, ?)\");\n    stmt.setString(1, id);\n    stmt.setString(2, pwd);\n    stmt.executeUpdate();\n}", "safeCodeKeywords": ["MessageDigest", "SHA-256", "salt"], "explanation": "비밀번호 같은 중요정보를 암호화·해시 처리 없이 평문으로 DB에 저장하므로 DB가 유출되면 그대로 노출되는 암호화되지 않은 중요정보 약점에 취약합니다. 솔트를 포함한 안전한 해시로 변환해 저장해야 합니다."}, {"id": "PC-10", "lang": "Python", "cat": "보안기능", "diff": "중", "title": "RSA 키쌍 생성 시 키 길이 설정 검토", "code": "from Crypto.PublicKey import RSA\ndef make_rsa_key_pair():\n    # RSA 키 길이를 1024비트로 짧게 설정한다.\n    private_key = RSA.generate(1024)\n    public_key = private_key.publickey()\n    return private_key, public_key", "isTruePositive": true, "weaknessName": "충분하지 않은 키 길이 사용", "cwe": "CWE-326", "reasonKeywords": ["RSA 1024", "키 길이 부족", "2048 미만", "해독 가능"], "negKw": ["취약한 암호화 알고리즘", "적절하지 않은 난수값", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "from Crypto.PublicKey import RSA\ndef make_rsa_key_pair():\n    # RSA 키 길이를 2048비트 이상으로 설정한다.\n    private_key = RSA.generate(2048)\n    public_key = private_key.publickey()\n    return private_key, public_key", "safeCodeKeywords": ["RSA.generate(2048)", "publickey", "private_key"], "explanation": "RSA 키 길이를 권장 기준(2048비트)에 못 미치는 1024비트로 설정하므로 충분한 계산 자원으로 키가 해독될 수 있는 충분하지 않은 키 길이 사용 약점에 취약합니다. 공개키는 2048비트 이상으로 생성해야 합니다."}, {"id": "PC-11", "lang": "Python", "cat": "보안기능", "diff": "하", "title": "회원 가입 비밀번호 등록 처리 검토", "code": "@app.route('/register', methods=['POST'])\ndef register():\n    userid = request.form.get('userid')\n    password = request.form.get('password')\n    confirm = request.form.get('confirm_password')\n    if password != confirm:\n        return make_response(\"패스워드가 일치하지 않습니다\", 400)\n    user = User()\n    user.userid = userid\n    user.password = password\n    db.session.add(user)\n    db.session.commit()\n    return make_response(\"회원가입 성공\", 200)", "isTruePositive": true, "weaknessName": "취약한 비밀번호 허용", "cwe": "CWE-521", "reasonKeywords": ["복잡도 검증 없음", "자릿수", "특수문자", "조합규칙 미확인"], "negKw": ["하드코드된 중요정보", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "import re\ndef check_password(password):\n    PT = re.compile('^(?=.*[A-Za-z])(?=.*[0-9@#$%^&*]).{8,}$')\n    return bool(PT.match(password))\n\n@app.route('/register', methods=['POST'])\ndef register():\n    userid = request.form.get('userid')\n    password = request.form.get('password')\n    confirm = request.form.get('confirm_password')\n    if password != confirm:\n        return make_response(\"패스워드가 일치하지 않습니다\", 400)\n    if not check_password(password):\n        return make_response(\"패스워드 조합규칙에 맞지 않습니다\", 400)\n    user = User()\n    user.userid = userid\n    user.password = password\n    db.session.add(user)\n    db.session.commit()\n    return make_response(\"회원가입 성공\", 200)", "safeCodeKeywords": ["check_password", "re.compile", "{8,}"], "explanation": "가입 시 비밀번호의 자릿수·특수문자 포함 여부 등 복잡도(조합규칙)를 전혀 검증하지 않으므로 1234 같은 취약한 비밀번호가 허용됩니다. 길이와 문자 조합 규칙을 검증해야 합니다."}, {"id": "PC-12", "lang": "Python", "cat": "보안기능", "diff": "중", "title": "클라이언트가 전달한 코드 실행 전 검증 로직 검토", "code": "def verify_data(request):\n    encrypted_code = request.POST.get(\"encrypted_msg\", \"\")\n    with open(f\"{PATH}/keys/secret_key.out\", \"rb\") as f:\n        secret_key = f.read()\n    origin_python_code = decrypt_with_symmetric_key(secret_key, encrypted_code)\n    # 전자서명 검증 없이 전달받은 코드를 그대로 실행\n    eval(origin_python_code)", "isTruePositive": true, "weaknessName": "부적절한 전자서명 확인", "cwe": "CWE-347", "reasonKeywords": ["전자서명 미검증", "서명 확인 없음", "위변조 탐지 불가", "신뢰할 수 없는 출처"], "negKw": ["코드 삽입", "신뢰할 수 없는 데이터의 역직렬화", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "from Crypto.PublicKey import RSA\nfrom Crypto.Hash import SHA256\nfrom Crypto.Signature import PKCS1_v1_5 as SIGNATURE_PKCS1_v1_5\ni  "취약하지 않", "오탐"], "safeCode": "public class WhitelistedObjectInputStream extends ObjectInputStream {\n    private final Set<String> whitelist;\n    public WhitelistedObjectInputStream(InputStream in, Set<String> wl) throws IOException {\n        super(in);\n        this.whitelist = wl;\n    }\n    @Override\n    protected Class<?> resolveClass(ObjectStreamClass desc)\n            throws IOException, ClassNotFoundException {\n        // 화이트리스트에 없는 클래스의 역직렬화를 거부한다.\n        if (!whitelist.contains(desc.getName())) {\n            throw new InvalidClassException(\"비인가 클래스\", desc.getName());\n        }\n        return super.resolveClass(desc);\n    }\n}", "safeCodeKeywords": ["resolveClass", "whitelist", "WhitelistedObjectInputStream"], "explanation": "외부에서 받은 바이트 스트림을 검증 없이 readObject로 역직렬화하면 공격자가 가젯 체인을 담은 객체를 보내 임의 코드를 실행시킬 수 있습니다. ObjectInputStream을 상속해 resolveClass에서 허용 클래스 화이트리스트만 통과시켜야 합니다."}, {"id": "EX-02", "lang": "Java", "cat": "보안기능", "diff": "상", "title": "JAR 코드 로딩 시 전자서명 확인 검토", "code": "public byte[] load(JarFile jar, String path) throws IOException {\n    Enumeration<JarEntry> ens = jar.entries();\n    while (ens.hasMoreElements()) {\n        JarEntry en = ens.nextElement();\n        if (path.equals(en.toString())) {\n            // 전자서명 주체 확인 없이 코드를 그대로 로딩한다.\n            return readAll(jar.getInputStream(en), en.getSize());\n        }\n    }\n    return null;\n}", "isTruePositive": true, "weaknessName": "부적절한 전자서명 확인", "cwe": "CWE-347", "reasonKeywords": ["전자서명 미검증", "getCodeSigners 미사용", "무결성 미확인", "위변조 코드", "서명 주체"], "negKw": ["무결성 검사 없는 코드 다운로드", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public byte[] load(JarFile jar, String path) throws IOException {\n    Enumeration<JarEntry> ens = jar.entries();\n    while (ens.hasMoreElements()) {\n        JarEntry en = ens.nextElement();\n        if (path.equals(en.toString())) {\n            byte[] data = readAll(jar.getInputStream(en), en.getSize());\n            // 전자서명 주체를 확인해 서명되지 않은 코드를 거부한다.\n tInstance(\"SHA-256\");\n    return md.digest(data);\n}", "safeCodeKeywords": ["SHA-256", "MessageDigest", "digest"], "explanation": "MD5는 충돌을 의도적으로 만들 수 있어 무결성·서명 용도로 더 이상 안전하지 않습니다. KISA가 안전하다고 분류한 SHA-256 등 SHA-2 계열 해시로 교체해야 합니다."}, {"id": "EX-05", "lang": "Java", "cat": "API오용", "diff": "상", "title": "요청 출처 신뢰 판단 로직 검토", "code": "public boolean isTrusted(HttpServletRequest req) throws Exception {\n    InetAddress addr = InetAddress.getByName(req.getRemoteAddr());\n    // 도메인명(DNS)으로 신뢰 여부를 판단한다.\n    return addr.getCanonicalHostName().endsWith(\"trustme.com\");\n}", "isTruePositive": true, "weaknessName": "DNS lookup에 의존한 보안 결정", "cwe": "CWE-350", "reasonKeywords": ["getCanonicalHostName", "DNS 캐시 변조", "도메인 기반 신뢰", "스푸핑"], "negKw": ["SSRF", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public boolean isTrusted(HttpServletRequest req) {\n    String ip = req.getRemoteAddr();\n    if (ip == null || \"\".equals(ip)) return false;\n    // DNS 호스트명 대신 IP 주소를 직접 비교해 DNS 변조에 방어한다.\n    String trustedAddr = \"10.0.0.5\";\n    return ip.equals(trustedAddr);\n}", "safeCodeKeywords": ["getRemoteAddr", "trustedAddr", "equals"], "explanation": "공격자가 DNS 캐시를 오염시키면 getCanonicalHostName이 반환하는 도메인명을 위조할 수 있어 도메인 기반 신뢰 판단은 우회됩니다. 보안 결정에는 getRemoteAddr로 얻은 IP 주소를 직접 비교해야 합니다."}, {"id": "EX-06", "lang": "Java", "cat": "에러처리", "diff": "중", "title": "예외 처리 구문 누락 여부 검토(설계 산출물 연계)", "code": "public void process(String data) {\n    try {\n        risky(data);\n    } catch (IOException e) {\n    }\n}", "isTruePositive": true, "weaknessName": "오류 상황 대응 부재", "cwe": "CWE-391", "reasonKeywords": ["빈 catch", "예외 무시", "오류 미처리", "로깅 부재", "상태 미복구"], "negKw": ["오류 메시지 정보 노출", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "public void process(String data) {\n    try {\n        risky(data);\n    } catch (IOException e) {\n        // 예외를 로깅하고 상위로 전파해 오류 상황에 대응한다.\n        logger.error(\"처리 실패\", e);\n        throw new ServiceException(\"처리 중 오류\", e);\n    }\n}", "safeCodeKeywords": ["logger.error", "throw", "catch"], "explanation": "catch 블록을 비워 두면 예외가 조용히 무시되어 오류 상황에서 시스템이 잘못된 상태로 계속 진행됩니다. 예외를 로깅하고 상위로 전파하거나 적절히 복구해 오류 상황에 대응해야 합니다."}, {"id": "EX-07", "lang": "C", "cat": "입력검증", "diff": "상", "title": "문자열 복사 버퍼 처리 검토(설계 요구사항 연계)", "code": "void copyName(const char *input) {\n    char buf[64];\n    // 입력 길이를 확인하지 않고 복사해 버퍼 경계를 넘을 수 있다.\n    strcpy(buf, input);\n    printf(\"%s\", buf);\n}", "isTruePositive": true, "weaknessName": "메모리 버퍼 오버플로우", "cwe": "CWE-120", "reasonKeywords": ["strcpy", "경계 검사 없음", "버퍼 크기 초과", "스택 손상", "널 종단 미보장"], "negKw": ["정수형 오버플로우", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "void copyName(const char *input) {\n    char buf[64];\n    // 대상 버퍼 크기만큼만 복사하고 널 종단을 보장한다.\n    strncpy(buf, input, sizeof(buf) - 1);\n    buf[sizeof(buf) - 1] = '\\0';\n    printf(\"%s\", buf);\n}", "safeCodeKeywords": ["strncpy", "sizeof"], "explanation": "strcpy는 입력 길이를 확인하지 않고 복사하므로 64바이트 버퍼를 넘는 입력이 들어오면 인접 메모리를 덮어써 스택이 손상됩니다. 대상 크기만큼만 복사하는 strncpy를 쓰고 마지막에 널 문자를 직접 넣어 종단을 보장해야 합니다."}, {"id": "EX-08", "lang": "C", "cat": "입력검증", "diff": "상", "title": "수량×단가 계산 정수 처리 검토(설계 요구사항 연계)", "code": "int totalPrice(int unit, int qty) {\n    // 입력 검증 없이 곱셈하여 정수 범위를 넘을 수 있다.\n    return unit * qty;\n}", "isTruePositive": true, "weaknessName": "정수형 오버플로우", "cwe": "CWE-190", "reasonKeywords": ["곱셈 오버플로우", "경계 검사 없음", "정수 범위 초과", "음수 우회", "잘못된 할당 크기"], "negKw": ["메모리 버퍼 오버플로우", "SQL 삽입", "안전한 코드", "취약하지 않", "오탐"], "safeCode": "int totalPrice(int unit, int qty) {\n    // 곱셈 전에 오버플로우 가능성을 검사한다.\n    if (qty < 0 || (qty != 0 && unit > INT_MAX / qty)) {\n        return -1;\n    }\n    return unit * qty;\n}", "safeCodeKeywords": ["INT_MAX", "qty"], "explanation": "unit*qty 결과가 int 최대값을 넘으면 값이 음수로 뒤집혀 잘못된 금액·할당 크기로 이어집니다. 곱셈 전에 qty 범위와 unit > INT_MAX / qty 조건으로 오버플로우 가능성을 검사해야 합니다."}, {"id": "EX-09", "lang": "Java", "cat": "보안기능", "diff": "중", "title": "회원 비밀번호 저장·전송 처리 안전성 검토", "code": "public void saveUser(String pw, HttpServletResponse resp) {\n    // 비밀번호는 bcr 질의는 Statement(문자열 결합) 대신 PreparedStatement(파라미터 바인딩)로 작성한다.", "code": "String id = request.getParameter(\"id\");          // 외부 입력(신뢰 불가)\nPreparedStatement ps = conn.prepareStatement(\n    \"SELECT * FROM users WHERE id = ?\");\nps.setString(1, id);                              // 안전한 바인딩\nps.executeQuery();", "sec": "외부 입력을 문자열로 SQL에 결합하면 \"SQL 삽입\"이다. PreparedStatement + setXxx 바인딩 구조가 정탐/오탐 판별의 1순위 단서다."}, {"lang": "C", "topic": "변수와 자료형", "desc": "C는 하드웨어에 가까운 언어로 자료형 크기가 메모리에 직접 대응한다(int, char, long, float). 초기화하지 않은 변수는 쓰레기 값을 가진다.", "code": "int count = 0;        /* 반드시 초기화 */\nchar grade = 'A';\nlong total = 0L;\nunsigned int size = 10u;", "sec": "초기화하지 않고 사용하면 \"초기화되지 않은 변수 사용\" 약점이 된다. 선언과 동시에 안전한 기본값을 주는지 확인한다."}, {"lang": "C", "topic": "포인터", "desc": "포인터는 메모리 주소를 담는 변수다. * 로 가리키는 값에 접근(역참조)하고, & 로 주소를 얻는다. NULL 포인터 역참조는 비정상 종료를 일으킨다.", "code": "int x = 10;\nint *p = &x;     /* p는 x의 주소 */\nprintf(\"%d\", *p); /* 역참조: 10 */\nif (p != NULL) { *p = 20; }  /* NULL 검사 후 사용 */", "sec": "NULL 또는 해제된 주소를 역참조하면 \"Null Pointer 역참조\"·\"해제된 자원 사용\" 약점이다. 사용 전 NULL 검사, free 후 재사용 금지가 진단 포인트다."}, {"lang": "C", "topic": "배열과 문자열", "desc": "C 문자열은 널 문자(\\0)로 끝나는 char 배열이다. 배열 경계를 넘어 쓰면 인접 메모리가 손상된다(버퍼 오버플로우).", "code": "char buf[16];\n/* 위험: strcpy(buf, src);  경계 검사 없음 */\nstrncpy(buf, src, sizeof(buf) - 1);   /* 대상 크기만큼만 */\nbuf[sizeof(buf) - 1] = '\\0';           /* 널 종료 보장 */", "sec": "대상 버퍼 크기를 넘겨 복사하면 \"메모리 버퍼 오버플로우\"다. strcpy/gets 대신 strncpy/snprintf 등 크기를 받는 안전 API 사용이 핵심 단서다."}, {"lang": "C", "topic": "동적 메모리", "desc": "malloc으로 힙 메모리를 할당하고 free로 해제한다. 해제 후에는 그 포인터를 다시 쓰면 안 되며, 해제하지 않으면 누수가 된다.", "code": "char *temp = (char *)malloc(BUFFER_SIZE);\nif (temp != NULL) {\n    strncpy(temp, src, BUFFER_SIZE - 1);\n    free(temp);     /* 마지막 사용 이후 해제 */\n    temp = NULL;    /* 재사용 방지 */\n}", "sec": "free 후 사용은 \"해제된 자원 사용\", 해제 누락은 \"부적절한 자원 해제\"다. 할당-사용-해제 순서와 해제 후 NULL 처리를 확인한다."}, {"lang": "C", "topic": "함수와 재귀", "desc": "함수는 작업 단위이며 자기 자신을 호출(재귀)할 수 있다. 재귀는 반드시 종료 조건(기저 사례)이 있어야 무한 반복을 피한다.", "code": "int factorial(int n) {\n    if (n <= 1) return 1;   /* 종료 조건(기저 사례) */\n    return n * factorial(n - 1);\n}", "sec": "종료 조건이 없거나 잘못되면 \"종료되지 않는 반복문/재귀함수\"로 스택 고갈이 발생한다. 기저 사례 존재 여부가 진단 포인트다."}, {"lang": "C", "topic": "표준 입출력과 위험 함수", "desc": "C 표준 라이브러리에는 경계를 검사하지 않는 위험 함수(gets, strcpy, sprintf, scanf \"%s\")가 있다. 크기를 받는 안전 버전으로 대체한다.", "code": "char str[100];\n/* 위험: gets(str);  입력 길이 무제한 */\nfgets(str, sizeof(str), stdin);   /* 크기 제한 */\n/* 또는 gets_s(str, sizeof(str)); */", "sec": "gets 등 폐기·위험 API 사용은 \"취약한 API 사용\"이다. 안전 대체 함수(fgets/gets_s/strncpy) 사용 여부가 정탐/오탐을 가른다."}, {"lang": "Python", "topic": "변수와 자료형", "desc": "Python은 동적 타입 언어로 변수에 타입을 명시하지 않는다. 숫자(int/float), 문자열(str), 불리언(bool) 등이 있고 타입은 실행 중 결정된다.", "code": "age = 30            # int\nrate = 0.75         # float\nname = \"홍길동\"      # str\nok = True           # bool\nitems = [1, 2, 3]   # list", "sec": "동적 타입이라 외부 입력이 예상과 다른 타입/형식일 수 있다. 입력 검증(형식·범위) 없이 사용하면 \"입력검증\" 유형 약점으로 이어진다."}, {"lang": "Python", "topic": "제어문과 함수", "desc": "들여쓰기로 블록을 구분한다. 조건은 if/elif/else, 반복은 for/while, 함수는 def로 정의한다.", "code": "def check_password(pw):\n    import re\n    pattern = re.compile(r\"^(?=.*[A-Za-z])(?=.*\\d).{8,}$\")\n    return bool(pattern.match(pw))\n\nif check_password(user_pw):\n    register()", "sec": "비밀번호 길이·복잡도 검증 정규식 같은 \"보안기능\"이 함수로 구현된다. 규칙이 충분한지(길이 8+ 등)가 \"취약한 비밀번호 허용\" 진단 포인트다."}, {"lang": "Python", "topic": "자료구조(list·dict·set)", "desc": "list(순서 있는 목록), dict(키-값), set(중복 없는 집합)이 핵심 컬렉션이다. 허용 목록(화이트리스트) 검증에 set/dict를 많이 쓴다.", "code": "ALLOWED_HOSTS = {\"img.example.com\", \"cdn.example.com\"}\nhost = urlparse(url).hostname\nif host not in ALLOWED_HOSTS:\n    raise ValueError(\"not allowed\")", "sec": "허용 목록(set) 기반 검증은 SSRF·오픈 리다이렉트 방어의 핵심 구조다. \"허용된 것만 통과\"하는지가 정탐/오탐을 가른다."}, {"lang": "Python", "topic": "모듈과 예외", "desc": "import로 모듈을 가져온다. 예외는 try/except로 처리하되, 광범위한 except가 아니라 구체적 예외를 잡는다.", "code": "try:\n    i = int(s.strip())\nexcept ValueError:        # 구체적 예외\n    print(\"숫자가 아닙니다\")\nexcept FileNotFoundError:\n    print(\"파일 없음\")", "sec": "bare except(또는 except Exception)로 모두 삼키면 \"부적절한 예외 처리\"다. 예외를 구체적으로 구분·대응하는지가 진단 포인트다."}, {"lang": "Python", "topic": "외부 명령과 위험 함수", "desc": "eval/exec는 문자열을 코드로 실행해 매우 위험하다. 외부 명령은 os.system(셸 경유) 대신 subprocess를 인자 리스트로 실행한다.", "code": "# 위험: eval(user_input) / os.system(cmd)\nimport ast, subprocess\nval = ast.literal_eval(user_input)        # 안전한 평가\nsubprocess.run([\"ping\", \"-c\", \"1\", host]) # 셸 미경유(리스트)", "sec": "eval/exec에 외부 입력 → \"코드 삽입\", os.system에 입력 결합 → \"운영체제 명령어 삽입\". ast.literal_eval·subprocess 리스트 형태가 안전 단서다."}, {"lang": "Python", "topic": "직렬화와 암호", "desc": "객체 저장/복원(직렬화)에 pickle은 위험하고 json이 안전하다. 비밀번호는 평문/단순해시 대신 솔트+적응형 해시로 저장한다.", "code": "import json, bcrypt\nobj = json.loads(data)                 # pickle 대신 json\nhashed = bcrypt.hashpw(pw.encode(),\n                       bcrypt.gensalt())  # 솔트+적응형", "sec": "pickle.loads(외부데이터) → \"신뢰할 수 없는 역직렬화\", 솔트 없는 단순 해시 → \"솔트 없이 일방향 해시\"·\"취약한 암호화\". json·bcrypt 사용이 안전 단서다."}];

const RUNNABLE = [{"lang": "Python", "weakness": "코드 삽입", "title": "eval vs ast.literal_eval", "code": "import ast\n\nsafe_in = \"[1, 2, 3]\"\nevil_in = \"__import__('os').getcwd()\"   # 공격 입력\n\nprint(\"[취약] eval(정상):\", eval(safe_in))\nprint(\"[취약] eval(공격):\", eval(evil_in), \" <- eval은 임의 코드를 실행해버림\")\n\nfor label, code in [(\"정상\", safe_in), (\"공격\", evil_in)]:\n    try:\n        print(f\"[안전] literal_eval({label}):\", ast.literal_eval(code))\n    except (ValueError, SyntaxError) as e:\n        print(f\"[안전] literal_eval가 {label} 입력 차단 ->\", type(e).__name__)\n", "note": "eval은 공격 입력까지 실행한다. ast.literal_eval은 리터럴만 허용해 코드 삽입을 차단한다."}, {"lang": "Python", "weakness": "적절하지 않은 난수값 사용", "title": "random vs secrets", "code": "import random, secrets\n\n# [취약] 시드를 알면 예측 가능 (재현됨)\nprint(\"[취약] random(seed=1234):\", random.Random(1234).randint(1000, 9999))\nprint(\"[취약] random(seed=1234):\", random.Random(1234).randint(1000, 9999), \"<- 항상 동일\")\n\n# [안전] 암호학적으로 안전한 난수\nprint(\"[안전] secrets.token_hex:\", secrets.token_hex(8))\nprint(\"[안전] secrets.token_hex:\", secrets.token_hex(8), \"<- 매번 다름\")\n", "note": "일반 PRNG(random)는 시드로 예측·재현된다. 토큰·키에는 secrets/SecureRandom을 써야 한다."}, {"lang": "Python", "weakness": "솔트 없이 일방향 해시함수 사용", "title": "단순 해시 vs 솔트+PBKDF2", "code": "import hashlib, os\n\npw = b\"password123\"\n\n# [취약] 솔트 없는 단순 해시 -> 같은 비밀번호는 항상 같은 값(레인보우 테이블 공격)\nprint(\"[취약] sha256(솔트X):\", hashlib.sha256(pw).hexdigest()[:32], \"...\")\nprint(\"[취약] sha256(솔트X):\", hashlib.sha256(pw).hexdigest()[:32], \"... <- 동일\")\n\n# [안전] 사용자별 솔트 + 반복(적응형) 해시\nsalt = os.urandom(16)\ndk = hashlib.pbkdf2_hmac('sha256', pw, salt, 100_000)\nprint(\"[안전] pbkdf2(솔트O):\", dk.hex()[:32], \"... <- 솔트마다 달라짐\")\n", "note": "솔트 없는 해시는 사전/레인보우 공격에 약하다. 사용자별 솔트 + 적응형(pbkdf2/bcrypt)이 표준."}, {"lang": "Java", "weakness": "SQL 삽입", "title": "문자열 결합 쿼리 vs 파라미터 바인딩", "code": "public class Main {\n    public static void main(String[] args) {\n        String id = \"1' OR '1'='1\";   // 공격 입력\n        // [취약] 외부 입력을 문자열로 결합\n        String vuln = \"SELECT * FROM users WHERE id = '\" + id + \"'\";\n        System.out.println(\"[취약] 생성된 쿼리: \" + vuln);\n        System.out.println(\"       -> 조건이 항상 참이 되어 전체 행이 노출됨(SQL 삽입)\");\n        // [안전] PreparedStatement는 ?로 값만 바인딩 -> 입력이 쿼리 '구조'를 못 바꿈\n        System.out.println(\"[안전] 쿼리: SELECT * FROM users WHERE id = ?  (값='\" + id + \"' 바인딩)\");\n        System.out.println(\"       -> 입력은 데이터로만 취급되어 삽입 불가\");\n    }\n}", "note": "문자열 결합은 입력이 쿼리 구조를 바꿔 SQL 삽입이 된다. PreparedStatement + setXxx 바인딩이 근본 대책."}, {"lang": "Java", "weakness": "정수형 오버플로우", "title": "int 오버플로우 vs long 승격", "code": "public class Main {\n    public static void main(String[] args) {\n        int max = Integer.MAX_VALUE;\n        System.out.println(\"[취약] Integer.MAX_VALUE + 1 = \" + (max + 1) + \"  <- 음수로 래핑\");\n        long safe = (long) max + 1;\n        System.out.println(\"[안전] (long)MAX_VALUE + 1 = \" + safe + \"  <- 정상\");\n        System.out.println(\"-> 연산 전 범위 검증/충분한 자료형/Math.addExact 사용\");\n    }\n}", "note": "고정폭 정수 연산이 한계를 넘으면 래핑(오버플로우)된다. 범위 검증·승격·Math.*Exact로 방지."}, {"lang": "Java", "weakness": "취약한 암호화 알고리즘 사용", "title": "안전한 해시(SHA-256)", "code": "import java.security.MessageDigest;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        MessageDigest md = MessageDigest.getInstance(\"SHA-256\");  // DES/MD5/SHA-1 금지\n        byte[] d = md.digest(\"hello\".getBytes(\"UTF-8\"));\n        StringBuilder sb = new StringBuilder();\n        for (byte b : d) sb.append(String.format(\"%02x\", b));\n        System.out.println(\"[안전] SHA-256: \" + sb);\n        System.out.println(\"-> MD5/SHA-1/DES 같은 취약 알고리즘 대신 SHA-256 이상/AES 사용\");\n    }\n}", "note": "MD5·SHA-1·DES는 취약하다. SHA-256 이상, 대칭키는 AES(GCM/CBC)로 교체해야 한다."}, {"lang": "C", "weakness": "정수형 오버플로우", "title": "INT_MAX 오버플로우 vs long", "code": "#include <stdio.h>\n#include <limits.h>\n\nint main(void) {\n    int max = INT_MAX;\n    printf(\"[취약] INT_MAX + 1 = %d   <- 음수로 래핑(오버플로우)\\n\", max + 1);\n    long safe = (long)max + 1;\n    printf(\"[안전] (long)INT_MAX + 1 = %ld\\n\", safe);\n    printf(\"-> 연산 전 범위 검증 및 충분한 크기의 자료형 사용\\n\");\n    return 0;\n}", "note": "C의 int 연산은 한계를 넘으면 미정의/래핑 동작을 한다. 경계 검증과 자료형 크기로 방지."}, {"lang": "C", "weakness": "메모리 버퍼 오버플로우", "title": "strcpy 위험 vs strncpy 안전", "code": "#include <stdio.h>\n#include <string.h>\n\nint main(void) {\n    char buf[8];\n    const char *src = \"ABCDEFGHIJKLMNOP\";   /* 16바이트 > buf(8) */\n    /* [안전] 대상 크기만큼만 복사 + 널 종료 보장 */\n    strncpy(buf, src, sizeof(buf) - 1);\n    buf[sizeof(buf) - 1] = '\\0';\n    printf(\"[안전] strncpy 결과(잘림): %s\\n\", buf);\n    printf(\"-> strcpy(buf, src) 였다면 buf 경계를 넘어 인접 메모리 손상(버퍼 오버플로우)\\n\");\n    return 0;\n}", "note": "경계를 검사하지 않는 strcpy/gets는 버퍼 오버플로우를 일으킨다. 크기를 받는 strncpy/snprintf 사용."}, {"lang": "C", "weakness": "포맷 스트링 삽입", "title": "printf(user) 위험 vs printf(\"%s\", user)", "code": "#include <stdio.h>\n\nint main(void) {\n    char *user = \"%x %x %x\";   /* 공격자가 포맷 지정자를 주입 */\n    printf(\"[취약] printf(user) -> \");\n    printf(user);              /* 포맷 문자열로 해석되어 메모리 누출 위험 */\n    printf(\"\\n[안전] printf(\\\"%%s\\\", user) -> \");\n    printf(\"%s\", user);        /* 사용자 입력은 인자로만 */\n    printf(\"\\n-> 포맷 문자열은 항상 고정 리터럴, 외부 입력은 %%s 인자로 전달\\n\");\n    return 0;\n}", "note": "사용자 입력을 printf의 포맷 인자로 직접 주면 포맷 스트링 삽입이 된다. 포맷은 고정하고 입력은 %s로."}];
const DESIGN = [{"id": "DR-01", "title": "회원 비밀번호 관리 프로세스 설계 보안성 검토", "scenario": "회원정보 관리 프로세스의 비밀번호 관리 설계 문서(요구사항 정의서·아키텍처 설계서·개발 가이드)를 보안성 검토하시오. 요구사항 정의서의 내용은 이상이 없다.", "docs": [{"name": "요구사항 정의서 (발췌)", "content": "[SR-020301] 안전한 비밀번호 생성규칙 적용\n - 비밀번호는 영문자·숫자·특수문자를 조합하여 8자리 이상을 사용한다.\n[SR-020302] 네트워크로 비밀번호 전송 시 암호화\n - 로그인/회원정보 수정 등 비밀번호 포함 요청은 HTTPS로 처리한다.\n[SR-020303] 비밀번호 저장 시 솔트가 적용된 안전한 해시함수 사용\n - 해시함수 실행은 \"서버에서\" 해야 한다."}, {"name": "아키텍처 설계서 (발췌)", "content": "[SR-020303] 구현방안\n ① 공통모듈로 해시를 추출하는 기능을 추가한다.\n ② 서버의 부하를 최소화하기 위해 \"클라이언트에서 해시함수를 실행\"한다.\n ③ 추출된 해시값과 솔트를 반환하도록 한다."}, {"name": "개발 가이드 (발췌, 비밀번호 검증 공통모듈)", "content": "public static boolean checkPasswd(String password) {\n  if (null == password || password.equals(\"\")) return false;\n  if (password.trim().length() < 6) {   // 비밀번호 최소 길이 검사\n    LOG.info(\"checkPasswd MIN!!\");\n    return false;\n  }\n  // ... 허용 문자 검사 ...\n  return true;\n}"}], "category": "보안기능", "isVulnerable": true, "weakness": "취약한 비밀번호 허용 / 부적절한 해시 수행 위치", "statusKeywords": ["클라이언트에서 해시", "6자리", "8자리", "요구사항 불일치", "서버에서 해시"], "fixKeywords": ["length() < 8", "8자리 이상", "서버에서 해시", "조건절 수정"], "modelStatus": "개발 가이드의 비밀번호 검증 공통모듈이 length() < 6 으로 검사하여, 생성규칙(8자리 이상)보다 짧은 6자리 비밀번호도 통과된다(취약한 비밀번호 허용). 또한 아키텍처 설계서는 해시함수를 클라이언트에서 실행하도록 설계하여, 요구사항(서버에서 해시 수행)과 불일치한다(클라이언트 해시는 해시값이 사실상 비밀번호처럼 재사용될 수 있어 안전하지 않다).", "modelFix": "공통모듈의 조건을 length() < 8 로 수정하여 8자리 이상만 통과하도록 하고, 해시함수는 서버에서 수행하도록 아키텍처를 변경한다(솔트 + SHA-2 이상 적용 유지).", "explanation": "요구사항(서버 해시·8자리)과 아키텍처/개발가이드(클라이언트 해시·6자리)가 불일치하여 발생한 결함입니다. 분류는 보안기능(2-3 비밀번호 관리)."}, {"id": "DR-02", "title": "게시판 서비스 화면 출력 설계 보안성 검토", "scenario": "사용자 게시글·검색어를 화면에 표시하는 게시판 서비스의 설계 문서를 보안성 검토하시오.", "docs": [{"name": "요구사항 정의서 (발췌)", "content": "[SR-010501] 웹 서비스 요청 및 결과 검증\n - 게시글 등록(스크립트 게시) 및 응답결과(웹페이지 출력)에 대한\n   유효성 검증 방법을 설계해야 한다."}, {"name": "아키텍처 설계서 (발췌)", "content": "[출력 처리]\n ① 입력값은 길이 제한(최대 4000자)만 적용한다.\n ② 게시글/검색어는 조회 성능을 위해 저장된 원본을 그대로 화면에 출력한다.\n ③ 출력 시 별도의 인코딩/이스케이프는 적용하지 않는다."}, {"name": "개발 가이드 (발췌)", "content": "out.println(\"<div class=\\\"result\\\">\" + keyword + \"<\/div>\");  // 검색어 출력\nout.println(\"<td>\" + post.getContent() + \"<\/td>\");          // 게시글 출력"}], "category": "입력데이터 검증 및 표현", "isVulnerable": true, "weakness": "크로스사이트 스크립트(XSS)", "statusKeywords": ["출력 인코딩 미적용", "이스케이프 누락", "스크립트 실행", "저장형 XSS", "원본 그대로 출력"], "fixKeywords": ["출력 인코딩", "HTML 이스케이프", "escapeHtml", "특수문자 변환"], "modelStatus": "아키텍처 설계서가 입력 길이 제한만 두고 출력 시 인코딩/이스케이프를 적용하지 않은 채 저장 원본을 그대로 출력하도록 설계되어, 게시글에 포함된 <script> 등이 다른 사용자 브라우저에서 실행되는 저장형 XSS가 발생한다(출력 인코딩 미적용).", "modelFix": "출력 직전에 HTML 메타문자(< > & 따옴표 등)를 이스케이프하는 출력 인코딩(escapeHtml 등)을 공통 적용하도록 설계하고, 입력 검증(허용 목록)도 병행한다.", "explanation": "XSS의 핵심 대책은 입력 필터링이 아니라 \"출력 시 인코딩\"입니다. 분류는 입력데이터 검증 및 표현(웹 서비스 요청·결과 검증)."}, {"id": "DR-03", "title": "결제 모듈 예외처리 설계 보안성 검토", "scenario": "외부 결제 연동 모듈의 오류·예외 처리 설계 문서를 보안성 검토하시오.", "docs": [{"name": "요구사항 정의서 (발췌)", "content": "[SR-040101] 예외처리\n - 오류메시지에 중요정보가 노출되거나 부적절한 에러 처리로\n   의도치 않은 상황이 발생하지 않도록 설계해야 한다."}, {"name": "개발 가이드 (발췌)", "content": "try {\n    pay = gateway.charge(order);\n} catch (PaymentException e) {\n    // 처리 없음 (호출부는 정상 결제로 간주하고 진행)\n} catch (Exception e) {\n    e.printStackTrace();\n    response.getWriter().println(\"오류: \" + e.toString()); // 사용자에게 상세 노출\n}"}], "category": "에러처리", "isVulnerable": true, "weakness": "오류 상황 대응 부재 / 오류 메시지 정보 노출", "statusKeywords": ["빈 catch", "예외 무시", "정상으로 간주", "printStackTrace", "상세 오류 노출"], "fixKeywords": ["예외 로깅", "상위 전파", "일반화된 오류 메시지", "상세정보 미노출", "롤백"], "modelStatus": "PaymentException을 빈 catch로 무시하여 결제 실패를 정상으로 간주하고 진행하며(오류 상황 대응 부재), Exception 블록은 printStackTrace와 e.toString()을 사용자에게 그대로 출력해 내부 정보가 노출된다(오류 메시지 정보 노출).", "modelFix": "예외를 로깅하고 상위로 전파하거나 거래를 롤백해 실패를 정확히 처리하며, 사용자에게는 상세 스택 대신 일반화된 오류 메시지만 보여주도록 설계한다.", "explanation": "빈 예외 블록(대응 부재)과 상세 오류 노출 두 결함이 함께 있습니다. 분류는 에러처리(예외처리)."}, {"id": "DR-04", "title": "로그인/세션 관리 설계 보안성 검토", "scenario": "로그인 및 세션 관리 설계 문서를 보안성 검토하시오.", "docs": [{"name": "요구사항 정의서 (발췌)", "content": "[SR-070101] 세션통제\n - 다른 세션 간 데이터 공유 금지, 세션ID 노출 금지,\n   (재)로그인 시 기존 세션ID 재사용 금지 등 안전한 세션 관리방안을 설계해야 한다."}, {"name": "아키텍처 설계서 (발췌)", "content": "[세션 처리]\n ① 최초 접속 시 세션을 생성하고 세션ID를 발급한다.\n ② 로그인 성공 시, 발급된 기존 세션을 그대로 유지하며 인증 상태만 세션에 저장한다.\n ③ 세션 타임아웃은 30분으로 설정한다."}], "category": "세션통제", "isVulnerable": true, "weakness": "세션 고정(Session Fixation)", "statusKeywords": ["로그인 후 세션ID 유지", "세션 재발급 누락", "세션 고정", "기존 세션 재사용"], "fixKeywords": ["로그인 성공 시 세션 재발급", "기존 세션 무효화", "세션ID 변경", "invalidate"], "modelStatus": "로그인 성공 후에도 기존 세션ID를 그대로 유지하도록 설계되어(요구사항의 \"재로그인 시 기존 세션ID 재사용 금지\" 위배), 공격자가 미리 고정시킨 세션ID로 인증이 이루어지는 세션 고정 공격이 가능하다.", "modelFix": "로그인 성공 시 기존 세션을 무효화(invalidate)하고 새로운 세션ID를 발급하도록 설계를 변경한다(세션 재발급).", "explanation": "세션 고정의 표준 대책은 로그인 성공 시 세션ID 재발급입니다. 분류는 세션통제."}, {"id": "DR-05", "title": "중요정보 암호화 모듈 설계 보안성 검토", "scenario": "개인정보를 암호화하여 저장하는 암호화 모듈의 설계 문서를 보안성 검토하시오.", "docs": [{"name": "요구사항 정의서 (발췌)", "content": "[SR-020401] 암호연산\n - 국제표준/검증필 암호모듈의 안전한 알고리즘과 충분한 키 길이,\n   솔트·충분한 난수(IV 등)를 적용한 안전한 암호연산을 설계해야 한다."}, {"name": "개발 가이드 (발췌)", "content": "// 대칭키 암호화\nCipher c = Cipher.getInstance(\"DES/ECB/PKCS5Padding\");\nc.init(Cipher.ENCRYPT_MODE, key);   // IV 미사용(ECB)\nbyte[] enc = c.doFinal(plain);"}], "category": "보안기능", "isVulnerable": true, "weakness": "취약한 암호화 알고리즘 사용", "statusKeywords": ["DES", "ECB 모드", "짧은 키 길이", "IV 미사용", "패턴 노출"], "fixKeywords": ["AES", "128비트 이상", "CBC", "GCM", "무작위 IV"], "modelStatus": "설계가 취약한 DES 알고리즘과 ECB 모드를 사용하도록 되어 있어, 키 길이가 짧아 전수 공격에 약하고 ECB는 동일 평문이 동일 암호문으로 드러나 패턴이 노출된다(IV도 미사용).", "modelFix": "AES(128비트 이상) 등 안전한 알고리즘과 CBC/GCM 같은 운영모드를 사용하고, 매 암호화마다 무작위 IV를 생성·적용하도록 설계한다.", "explanation": "대칭키는 128비트 이상, ECB 금지·무작위 IV 적용이 핵심입니다. 분류는 보안기능(암호연산)."}, {"id": "DR-06", "title": "고객 조회 DBMS 질의 설계 보안성 검토", "scenario": "고객 정보를 조건으로 조회하는 DBMS 질의 처리 설계 문서를 보안성 검토하시오.", "docs": [{"name": "요구사항 정의서 (발췌)", "content": "[SR-010101] DBMS 조회 및 결과 검증\n - 질의문(SQL) 내 입력값과 조회결과에 대한 유효성 검증방법(필터링 등)을\n   설계하고, 유효하지 않은 값 // ── 오답노트 SRS(SM-2 경량: ease factor 기반 간격 반복) ──
const DAY=86400000;
// 구버전/누락 항목 정규화: box·due·ef·rep·interval 보강(기존 오답은 즉시 복습 대상)
(function(){let m=false;wrongs.forEach(w=>{
  if(typeof w.box!=='number'){w.box=1;m=true;}
  if(typeof w.due!=='number'){w.due=Date.now();m=true;}
  if(typeof w.ef!=='number'){w.ef=2.5;m=true;}        // 용이도 인수(1.3~)
  if(typeof w.rep!=='number'){w.rep=0;m=true;}         // 연속 정답 횟수
  if(typeof w.interval!=='number'){w.interval=0;m=true;}
});if(m)save('wrong',wrongs);})();
function srsDue(w){return (w.due||0)<=Date.now();}
function dueCount(){return wrongs.filter(srsDue).length;}
// quality 0~5(다시=2, 애매=3, 완벽=5). SM-2: interval=1,6,prev*ef … 충분 숙달 시 졸업.
function srsUpdate(w,quality){
  if(typeof w.ef!=='number')w.ef=2.5; if(typeof w.rep!=='number')w.rep=0;
  if(quality>=3){
    w.rep++;
    if(w.rep===1)w.interval=1; else if(w.rep===2)w.interval=6; else w.interval=Math.round((w.interval||6)*w.ef);
    w.ef=Math.max(1.3, w.ef + (0.1-(5-quality)*(0.08+(5-quality)*0.02)));
    w.box=Math.min((w.box||1)+1,5);
    if(w.rep>=4 && quality>=4){wrongs=wrongs.filter(x=>x!==w);save('wrong',wrongs);if(typeof gam!=='undefined'){gam.graduates=(gam.graduates||0)+1;awardXp(8,'복습 졸업');}return {graduated:true,interval:w.interval};}  // 졸업(반복 숙달)
  }else{
    w.rep=0; w.interval=0; w.box=1; w.ef=Math.max(1.3, w.ef-0.2);  // 실패 → 즉시 재출제
  }
  w.due=Date.now()+w.interval*DAY;
  save('wrong',wrongs);return {graduated:false,interval:w.interval};
}
// 다음 복습까지 남은 일수(표시용)
function daysUntil(w){const d=Math.ceil(((w.due||0)-Date.now())/DAY);return d<=0?'지금':('약 '+d+'일 후');}
// 새 오답 추가(이미 있으면 1단계로 리셋해 다시 복습 대상화) + 7대 유형 누적 통계
function addWrong(it){
  if(it.cat&&CATS.indexOf(it.cat)>=0){wrongStats[it.cat]=(wrongStats[it.cat]||0)+1;save('wrongStats',wrongStats);}
  const ex=wrongs.find(w=>w.q===it.q);if(ex){ex.box=1;ex.due=Date.now();ex.rep=0;ex.interval=0;save('wrong',wrongs);return;}
  it.box=1;it.due=Date.now();it.addedAt=Date.now();it.ef=2.5;it.rep=0;it.interval=0;wrongs.push(it);save('wrong',wrongs);
}

// 실제 교육 플랫폼(TryHackMe·Secure Code Warrior·Duolingo)의 동기부여 설계를 무료 클라이언트(localStorage)로 이식.
let gam = load('gam',{xp:0,streak:0,bestStreak:0,lastActive:'',days:{},badges:{},claimed:{},graduates:0,visited:{}});
const DAILY_GOAL = 50;            // 하루 권장 XP
function _pad2(n){return String(n).padStart(2,'0');}
function todayKey(d){d=d||new Date();return d.getFullYear()+'-'+_pad2(d.getMonth()+1)+'-'+_pad2(d.getDate());}
function _ymd(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
// 레벨 곡선: 레벨업마다 필요 XP가 1.35배씩 증가(완만한 성장)
function levelInfo(xp){let l=1,need=100,rem=xp||0;while(rem>=need){rem-=need;l++;need=Math.round(need*1.35);}return {level:l,inLevel:rem,need:need,pct:Math.round(rem/need*100)};}
function touchDay(){
  const t=todayKey();
  if(gam.lastActive!==t){
    const y=_ymd(new Date());y.setDate(y.getDate()-1);
    gam.streak=(gam.lastActive===todayKey(y))?((gam.streak||0)+1):1;
    gam.lastActive=t;
    if(gam.streak>(gam.bestStreak||0))gam.bestStreak=gam.streak;
  }
  if(gam.days[t]==null)gam.days[t]=0;
}
function awardXp(n,reason,claimKey){
  if(claimKey){if(gam.claimed[claimKey])return 0;gam.claimed[claimKey]=1;}
  if(n>0){touchDay();gam.xp=(gam.xp||0)+n;const t=todayKey();gam.days[t]=(gam.days[t]||0)+n;}
  const newly=checkBadges();
  save('gam',gam);
  if(n>0&&reason)gamToast('+'+n+' XP · '+reason);
  newly.forEach(b=>gamToast('🏅 배지 획득: '+b.icon+' '+b.name));
  const dh=document.getElementById('gamHeader');if(dh)dh.innerHTML=gamHeaderHtml();
  return n;
}

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function gnorm(s){return (s||'').toString().toLowerCase().replace(/[\s.,;:!?()\[\]{}"'`]/g,'');}
// 코드 주석 제거(검증 연극 차단): 주석 속 키워드로 만점받는 우회를 막는다.
// URL의 '://' 와 정규식/문자열 속 '#' 는 보존(오탐 방지)하기 위해 보수적으로 제거한다.
function stripCode(s){return (s||'').toString()
  .replace(/\/\*[\s\S]*?\*\//g,' ')      // 블록 주석 /* */
  .replace(/([^:])\/\/[^\n]*/g,'$1 ')    // 인라인 // 주석 (단, URL의 :// 는 보존)
  .replace(/^[ \t]*\/\/[^\n]*/gm,' ')    // 줄 시작 // 주석
  .replace(/^[ \t]*#[^\n]*/gm,' ');}     // 줄 시작 # 주석 (정규식/문자열 속 # 는 보존)
// ── tree-sitter AST 정밀 전처리 (무료·클라이언트, 실패 시 정규식 stripCode로 자동 폴백) ──
const TSLANG={'Java':'java','C':'c','Python':'python'};
let tsCore=null, tsParser={}, tsLoadP={};
function loadTreeSitter(lang){
  const L=TSLANG[lang]; if(!L) return Promise.resolve(false);
  if(tsParser[L]) return Promise.resolve(true);
  if(tsLoadP[L]) return tsLoadP[L];
  tsLoadP[L]=(async()=>{
    const CDN='https://cdn.jsdelivr.net/npm/web-tree-sitter@0.22.6';
    if(!tsCore){
      await new Promise((res,rej)=>{const s=document.createElement('script');s.src=CDN+'/tree-sitter.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      const TS=window.TreeSitter||window.Parser;
      await TS.init({locateFile:()=>CDN+'/tree-sitter.wasm'});
      tsCore=TS;
    }
    const grammar=await tsCore.Language.load('https://cdn.jsdelivr.net/npm/tree-sitter-wasms@0.1.11/out/tree-sitter-'+L+'.wasm');
    const p=new tsCore(); p.setLanguage(grammar); tsParser[L]=p; return true;
  })().catch(()=>false);
  return tsLoadP[L];
}
function astReady(lang){return !!tsParser[TSLANG[lang]];}
// AST로 주석을 정확히 제거(문자열 속 //·# 오탐 없음). 미로딩/실패 시 정규식 폴백.
function cleanCode(code, lang){
  const L=TSLANG[lang];
  try{
    if(L && tsParser[L]){
      const tree=tsParser[L].parse(code||''); let src=code||''; const cuts=[];
      (function walk(n){const t=n.type;if(t==='comment'||t==='line_comment'||t==='block_comment'){cuts.push([n.startIndex,n.endIndex]);}for(let i=0;i<n.childCount;i++)walk(n.child(i));})(tree.rootNode);
      cuts.sort((a,b)=>b[0]-a[0]).forEach(c=>{src=src.slice(0,c[0])+' '.repeat(c[1]-c[0])+src.slice(c[1]);});
      return src;
    }
  }catch(e){}
  return stripCode(code);
}
function kwHit(t,k){const g=gnorm(k);return !!g&&gnorm(t).includes(g);}  // 빈 정규화 키워드(구두점만)는 항상매치 방지
function kwScore(t,kws,max){if(!kws||!kws.length)return 0;const h=kws.filter(k=>kwHit(t,k)).length;return Math.round(h/kws.length*max);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function diffBadge(d){const c={'하':['#dcfce7','#15803d'],'중':['#fef9c3','#a16207'],'상':['#fee2e2','#b91c1c']}[d]||['#eef2ff','#4338ca'];return '<span style="display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 9px;font-family:JetBrains Mono,monospace;background:'+c[0]+';color:'+c[1]+'">난이도 '+d+'</span>';}
// 취약 코드 → 안전 코드 라인 단위 diff (LCS)
function lineDiff(a,b){const A=(a||'').split('\n'),B=(b||'').split('\n'),n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;const out=[];
  while(i<n&&j<m){if(A[i]===B[j]){out.push(['ctx',A[i]]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){out.push(['del',A[i]]);i++;}else{out.push(['add',B[j]]);j++;}}
  while(i<n){out.push(['del',A[i]]);i++;}while(j<m){out.push(['add',B[j]]);j++;}
  return out;}
function diffHtml(a,b){return lineDiff(a,b).map(p=>{const s=p[0]==='del'?'- ':p[0]==='add'?'+ ':'  ';return '<span class="d-'+p[0]+'">'+esc(s+p[1])+'</span>';}).join('\n');}

function startExam(n,mcOnly){
  let items=examItems();if(mcOnly)items=items.filter(q=>q.type==='MC');
  let pool=shuffle(items).slice(0,Math.min(n,items.length));

  const q=exPool[exIdx],pct=Math.round(exIdx/exN*100);const cat=q.c||q.cat||'';let body='';

  else if(q.type==='OX'){body='<div class="tfrow"><div class="tf'+(exAns[exIdx]===true?' sel tp':'')+'" onclick="pickEx(true)"><span class="rd"></span>⭕ 맞다 (O)</div><div class="tf'+(exAns[exIdx]===false?' sel fp':'')+'" onclick="pickEx(false)"><span class="rd"></span>❌ 아니다 (X)</div></div>';}
  else{body='<input class="shortin" id="shortIn" placeholder="정답을 입력하세요" value="'+esc(exAns[exIdx]||'')+'" oninput="exAns['+exIdx+']=this.value">';}

function pickEx(v){exAns[exIdx]=v;drawExam();}
function prevEx(){if(exIdx>0){exIdx--;drawExam();}}

function exCorrect(q,a){if(a==null||a==='')return false;if(q.type==='MC')return a===q.a;if(q.type==='OX')return a===q.a;return (q.answers||[]).some(x=>{const u=gnorm(a),g=gnorm(x);return u&&(u===g||u.includes(g)||g.includes(u));});}
function exAnsText(q){if(q.type==='MC')return 'ABCD'[q.a]+'. '+q.o[q.a];if(q.type==='OX')return q.a?'O (맞다)':'X (아니다)';return (q.answers||[]).join(' / ');}
function exUserText(q,a){if(a==null||a==='')return '(미응답)';if(q.type==='MC')return (q.o[a]!=null?('ABCD'[a]+'. '+q.o[a]):String(a));if(q.type==='OX')return a?'O (맞다)':'X (아니다)';return String(a);}

function gradeExam(){
  clearInterval(exTimer);let sc=0;const rev=[];
  exPool.forEach((q,i)=>{
    const ok=exCorrect(q,exAns[i]);const key='['+({MC:'객관식',OX:'OX',SHORT:'단답'}[q.type])+'] '+q.q;
    if(ok){sc++;removeWrong(key);} else {addWrong({q:key,a:exAnsText(q),e:q.e,tag:'1교시',code:q.code||'',cat:q.c||q.cat||''});}
    rev.push({q,a:exAns[i],ok});
  });
  const pct=Math.round(sc/exN*100),pass=pct>=70;if(examBest==null||pct>examBest){examBest=pct;save('examBest',pct);}
  awardXp(Math.max(3,Math.round(pct/5)),'1교시 응시 '+pct+'%');
  const reviewHtml=rev.map((r,i)=>{
    const q=r.q;const tag=({MC:'객관식',OX:'OX',SHORT:'단답형'}[q.type]);
    return '<div class="rev '+(r.ok?'ok':'no')+'"><div class="rv-h"><span class="typetag t-'+q.type+'">'+tag+'</span> '+(r.ok?'✔ 정답':'✗ 오답')+' <span class="rv-cat">'+esc(q.c||q.cat||'')+'</span></div>'+
      '<div class="rv-q">'+(i+1)+'. '+esc(q.q)+'</div>'+
      (r.ok?'':'<div class="rv-mine">내 답: '+esc(exUserText(q,r.a))+'</div>')+
      '<div class="rv-ans">정답: '+esc(exAnsText(q))+'</div>'+
      (q.e?'<div class="rv-exp">'+esc(q.e)+'</div>':'')+'</div>';
  }).join('');
  document.getElementById('v-exam').innerHTML='<div class="res"><div class="big">'+pct+'%</div><div class="pf '+(pass?'pass':'fail')+'">'+(pass?'✅ 합격 (70%+)':'❌ 불합격')+'</div><p class="sub">'+exN+'문항 중 '+sc+'문항 정답</p><div class="quick" style="justify-content:center"><button class="btn" onclick="rExam()">다시 응시</button><button class="btn ghost" onclick="tab(\'wrong\')">오답노트 ('+wrongs.length+')</button></div></div>'+
    '<h3 class="rev-title">📝 문항별 해설</h3><div class="rev-list">'+reviewHtml+'</div>';
  announce('1교시 채점 완료. '+pct+'점, '+(pass?'합격':'불합격')+'. '+exN+'문항 중 '+sc+'문항 정답.');
  window.scrollTo(0,0);
}

function verifySecurePattern(code, lang, weakness){
  const def=LASHR[weakness]; if(!def) return {mapped:false, ok:false};  // 미매핑 약점은 키워드 채점만
  const c=cleanCode(code, lang);  // AST(또는 정규식 폴백)로 주석 제거 후 검사
  const allOk=!def.all || def.all.every(r=>r.test(c));
  const anyOk=!def.any || def.any.some(r=>r.test(c));
  const noneOk=!def.none || def.none.every(r=>!r.test(c));
  return {mapped:true, ok: allOk && anyOk && noneOk};
}
function gradeOne(p,ans){
  let parts=[],score=0;const tpOK=(ans.tp===p.isTruePositive);let struct=null;
  if(p.isTruePositive){
    parts.push(['정·오탐 판별',tpOK?30:0,30]);score+=tpOK?30:0;
    let nm=0;if(ans.tp){const u=gnorm(ans.name),g=gnorm(p.weaknessName);if(u&&u===g)nm=20;else if(u&&(g.includes(u)||u.includes(g))&&u.length>=2)nm=10;}parts.push(['보안약점 명칭',nm,20]);score+=nm;
    const rk=kwScore(ans.reason,p.reasonKeywords,25);parts.push(['진단 근거',rk,25]);score+=rk;
    let ck=ans.tp?kwScore(cleanCode(ans.fix,p.lang),p.safeCodeKeywords,25):0;
    if(ans.tp){
      struct=verifySecurePattern(ans.fix,p.lang,p.weaknessName);
      if(struct.mapped){
        if(struct.ok)ck=25;                 // 핵심 구조 검증 통과 → 만점 보장
        else ck=Math.min(ck,18);            // 키워드만 있고 구조 미확인 → 부분 인정(상한 18)
      }
    }
    parts.push(['개선 코드',ck,25]);score+=ck;
  }else{
    parts.push(['정·오탐 판별',tpOK?50:0,50]);score+=tpOK?50:0;
    const rk=kwScore(ans.reason,p.reasonKeywords,50);parts.push(['판별 근거',rk,50]);score+=rk;
  }
  // 틀린/부적절한 진단 서술 감점 (예: 안전한 코드를 취약하다고 단정)
  const negHits=(p.negKw||[]).filter(k=>kwHit(ans.reason,k)||(ans.tp&&p.isTruePositive&&kwHit(ans.name,k)));
  const penalty=Math.min(negHits.length*8, p.isTruePositive?24:30);
  if(penalty){score-=penalty;parts.push(['오류 서술 감점',-penalty,0,true]);}
  return {score:Math.max(0,Math.round(score)),parts,tpOK,negHits,penalty,struct};
}

function slug(s){return (s||'').toString().replace(/[^A-Za-z0-9가-힣]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'item';}
function buildSarif(results){
  const EXT={'Java':'java','C':'c','Python':'py'};
  const ruleMap={};
  const sarifResults=results.map((it,i)=>{
    const p=it.p,r=it.r,ans=it.ans||{};
    const rid=p.isTruePositive?(p.cwe||p.weaknessName||'KISA-WEAKNESS'):'KISA-SAFE';
    if(!ruleMap[rid])ruleMap[rid]={id:rid,name:(p.isTruePositive?(p.weaknessName||'보안약점'):'안전한 코드(오탐 대상)'),
      shortDescription:{text:(p.isTruePositive?(p.weaknessName+(p.cwe?(' ('+p.cwe+')'):'')):'정상 코드 — 취약점 없음')},
      properties:{category:p.cat||'',kisaType:p.cat||''}};
    const judged=(ans.tp===p.isTruePositive);
    const uri='practical/'+slug(p.title)+'.'+(EXT[p.lang]||'txt');
    return {ruleId:rid,
      level:p.isTruePositive?(judged?'error':'warning'):'note',
      message:{text:(p.isTruePositive?'정탐(보안약점 존재)':'오탐(안전한 코드)')+' · 응시자 판별: '+(ans.tp?'정탐':'오탐')+' ('+(judged?'정확':'오답')+') · 점수 '+(r?r.score:0)+'/100'+(ans.reason?(' · 근거: '+ans.reason):'')},
      locations:[{physicalLocation:{artifactLocation:{uri:uri},region:{startLine:1}}}],
      properties:{isTruePositive:!!p.isTruePositive,userJudgedTruePositive:!!ans.tp,judgmentCorrect:judged,score:(r?r.score:0),language:p.lang,kisaType:p.cat||'',weakness:p.weaknessName||''}};
  });
  return {"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0",
    runs:[{tool:{driver:{name:"SecureDevAcademy-LASHR",informationUri:"https://vuln-sim.web.app",version:"1.0.0",
      organization:"KISA 보안약점 진단원 학습 센터",rules:Object.keys(ruleMap).map(k=>ruleMap[k])}},
      results:sarifResults}]};
}
function exportSarif(){

}

function gradeDesign(d,ans){
  let parts=[],s=0;
  const cOK=ans.cat===d.category;parts.push(['보안약점 분류',cOK?20:0,20]);s+=cOK?20:0;
  const vOK=ans.vuln===d.isVulnerable;parts.push(['진단결과(Y/N)',vOK?20:0,20]);s+=vOK?20:0;
  const sk=kwScore(ans.status,d.statusKeywords,30);parts.push(['현황 및 문제점',sk,30]);s+=sk;
  const fk=kwScore(ans.fix,d.fixKeywords,30);parts.push(['개선방안',fk,30]);s+=fk;
  return {score:Math.round(s),parts:parts,cOK:cOK,vOK:vOK};
}
function submitDesign(){
  const d=DESIGN[dsIdx];
  if(dsV===null){alert('진단결과(Y/N)를 선택하세요.');return;}
  const ans={cat:document.getElementById('dsCat').value,vuln:dsV,status:document.getElementById('dsStatus').value,fix:document.getElementById('dsFix').value};
  const r=gradeDesign(d,ans);
  awardXp(Math.max(4,Math.round(r.score/4)),'설계 진단 '+r.score+'점');
  const wkey='[설계 진단] '+d.title;
  if(r.score<60)addWrong({q:wkey,a:'분류: '+d.category+' / '+(d.isVulnerable?'Y(취약)':'N(이상없음)'),e:d.explanation,tag:'설계',code:'',cat:''});
  else if(r.score>=70)removeWrong(wkey);
  const bars=r.parts.map(p=>'<div class="prow2"><div class="l">'+p[0]+'</div><div class="bar"><i style="width:'+Math.round(p[1]/p[2]*100)+'%"></i></div><div class="g">'+p[1]+'/'+p[2]+'</div></div>').join('');
  const skw=d.statusKeywords.map(k=>'<span class="kw'+(kwHit(ans.status,k)?' hit':'')+'">'+esc(k)+'</span>').join('');
  const fkw=d.fixKeywords.map(k=>'<span class="kw'+(kwHit(ans.fix,k)?' hit':'')+'">'+esc(k)+'</span>').join('');
  const pass=r.score>=70;
  document.getElementById('dsReport').innerHTML='<div class="report"><div class="scoreline"><div class="num '+(pass?'pass':'fail')+'">'+r.score+'점</div><div>'+(r.cOK?'<span class="pass">✔ 분류 정확</span>':'<span class="fail">✗ 분류 오답</span>')+' '+(r.vOK?'<span class="pass">✔ 진단결과 정확</span>':'<span class="fail">✗ 진단결과 오답</span>')+'</div></div>'+bars+
   '<div class="model"><h4>📋 모범 진단보고서</h4>'+
   '<div style="font-size:13.5px;margin:6px 0"><b>분류:</b> '+esc(d.category)+' &nbsp; <b>진단결과:</b> '+(d.isVulnerable?'Y (취약)':'N (이상 없음)')+' &nbsp; <b>관련 약점:</b> '+esc(d.weakness)+'</div>'+
   '<div style="margin:8px 0"><b>현황·문제점 핵심 키워드:</b><br>'+skw+'</div>'+
   '<div style="font-size:14px;line-height:1.7;margin:6px 0"><b>현황 및 문제점:</b> '+esc(d.modelStatus)+'</div>'+
   '<div style="margin:8px 0"><b>개선방안 핵심 키워드:</b><br>'+fkw+'</div>'+
   '<div style="font-size:14px;line-height:1.7;margin:6px 0"><b>개선방안:</b> '+esc(d.modelFix)+'</div>'+
   '<div style="font-size:13.5px;color:var(--muted);margin-top:8px">💡 '+esc(d.explanation)+'</div></div>'+
   '<div class="nav" style="display:block"><button class="btn ghost" onclick="rDesign()">← 목록으로</button></div></div>';
  document.getElementById('dsReport').scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ===== 💻 온라인 IDE (Monaco + Pyodide/Piston 실제 실행) =====
const IDELANGMAP={'Java':'java','C':'c','Python':'python'};
let ideEditor=null, ideMonacoP=null, ideCur=null, pyodide=null, pyLoadP=null, pistonRuntimes=null;
function loadMonaco(){
  if(window.monaco) return Promise.resolve();
  if(ideMonacoP) return ideMonacoP;
  ideMonacoP=new Promise((res,rej)=>{
    const base='https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs';
    const s=document.createElement('script');s.src=base+'/loader.js';
    s.onload=()=>{window.require.config({paths:{vs:base}});window.require(['vs/editor/editor.main'],()=>res());};
    s.onerror=rej;document.head.appendChild(s);
  });
  return ideMonacoP;
}
function ideOptions(){
  let h='<optgroup label="▶ 실행 가능 보안 데모 (취약 vs 안전)">';
  RUNNABLE.forEach((r,i)=>{h+='<option value="R:'+i+'">['+esc(r.lang)+'] '+esc(r.weakness)+' — '+esc(r.title)+'</option>';});
  h+='</optgroup><optgroup label="📄 KISA 49개 단편 (편집·실험용)">';
  CONCEPTS.forEach((c,ci)=>{const cd=CODE49[c.name];if(!cd)return;const jl=cd.javaLang||'Java';
    if(cd.javaVuln)h+='<option value="C:'+ci+':javaVuln">['+esc(jl)+' 취약] '+esc(c.name)+'</option>';
    if(cd.javaSafe)h+='<option value="C:'+ci+':javaSafe">['+esc(jl)+' 안전] '+esc(c.name)+'</option>';
    if(cd.pyVuln)h+='<option value="C:'+ci+':pyVuln">[Python 취약] '+esc(c.name)+'</option>';
    if(cd.pySafe)h+='<option value="C:'+ci+':pySafe">[Python 안전] '+esc(c.name)+'</option>';
  });
  h+='</optgroup>';return h;
}
function ideLoad(){
  const v=document.getElementById('ideExample').value;let code='',lang='Python',note='';
  if(v[0]==='R'){const r=RUNNABLE[+v.slice(2)];code=r.code;lang=r.lang;note='✅ 실행 가능 데모 — '+r.note;}
  else{const p=v.split(':');const c=CONCEPTS[+p[1]];const cd=CODE49[c.name];const f=p[2];code=cd[f]||'';
    lang=(f.indexOf('java')===0)?(cd.javaLang==='C'?'C':'Java'):'Python';
    note='📄 KISA 가이드 단편 — 프레임워크/문맥에 의존하므로 그대로는 컴파일·실행이 안 될 수 있습니다(편집·실험용). 실행 가능한 데모는 목록 상단에서 선택하세요.';}
  ideCur={lang};
  document.getElementById('ideLang').textContent=lang;
  document.getElementById('ideNote').textContent=note;
  if(ideEditor){ideEditor.setValue(code);window.monaco.editor.setModelLanguage(ideEditor.getModel(),IDELANGMAP[lang]||'plaintext');}
}
function rIDE(){
  if(ideEditor){try{ideEditor.dispose();}catch(e){}ideEditor=null;}
  document.getElementById('v-ide').innerHTML=
    '<h2 class="st">💻 코드 실행 — 온라인 IDE</h2><p class="sub">VS Code 엔진(<b>Monaco</b>)에서 직접 편집·실행합니다. <b>Python</b>은 브라우저 내 실제 실행(Pyodide), <b>Java·C</b>는 무료 외부 실행 API(Piston)로 컴파일·실행합니다. ⚠️ Java/C 실행 시 코드가 외부 서비스로 전송됩니다(교육용 예제 기준).</p>'+
    '<div class="ide-bar"><select id="ideExample" class="ide-sel" onchange="ideLoad()" aria-label="예제 선택">'+ideOptions()+'</select><span class="ide-lang" id="ideLang"></span><button class="qbtn" id="ideRunBtn" onclick="runIDE()">▶ 실행</button><button class="qbtn ghost" onclick="ideLoad()">↺ 예제 복원</button></div>'+
    '<div class="ide-note" id="ideNote"></div>'+
    '<div id="ideEditor" class="ide-editor">에디터를 불러오는 중…</div>'+
    '<div class="ide-out-h">📤 출력 <span id="ideStatus" class="ide-status"></span></div>'+
    '<pre class="ide-out" id="ideOut">▶ 실행 버튼을 누르면 결과가 여기에 표시됩니다.</pre>';
  loadMonaco().then(()=>{
    document.getElementById('ideEditor').textContent='';
    ideEditor=window.monaco.editor.create(document.getElementById('ideEditor'),{value:'',language:'python',theme:'vs-dark',fontSize:13.5,minimap:{enabled:false},automaticLayout:true,scrollBeyondLastLine:false});
    ideLoad();
  }).catch(()=>{document.getElementById('ideEditor').innerHTML='<div class="ide-fallback">에디터(Monaco)를 불러오지 못했습니다. 네트워크 연결을 확인한 뒤 다시 시도하세요.</div>';});
}
function ideStat(t){const e=document.getElementById('ideStatus');if(e)e.textContent=t||'';}
function ideOut(t){const e=document.getElementById('ideOut');if(e)e.textContent=t;}
function loadPyodideOnce(){
  if(pyodide)return Promise.resolve(pyodide);
  if(pyLoadP)return pyLoadP;
  pyLoadP=(async()=>{
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
    pyodide=await window.loadPyodide({indexURL:'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/'});
    return pyodide;
  })();
  return pyLoadP;
}
async function runPython(code){
  const py=await loadPyodideOnce();
  py.runPython('import sys,io\n_buf=io.StringIO()\nsys.stdout=_buf\nsys.stderr=_buf');
  let err='';
  try{py.runPython(code);}catch(e){err='\n'+String(e.message||e);}
  let out='';try{out=py.runPython('_buf.getvalue()');}catch(e){}
  return (out||'')+err;
}
async function pistonRun(lang,code){
  if(!pistonRuntimes){const r=await fetch('https://emkc.org/api/v2/piston/runtimes');pistonRuntimes=await r.json();}
  const want=(lang==='Java')?['java']:(lang==='C')?['c']:[lang.toLowerCase()];
  const rt=pistonRuntimes.find(x=>want.includes(x.language)||((x.aliases||[]).some(a=>want.includes(a))));
  if(!rt)throw new Error('실행 런타임을 찾지 못했습니다: '+lang);
  const fname=(lang==='Java')?'Main.java':(lang==='C')?'main.c':'main.txt';
  const r=await fetch('https://emkc.org/api/v2/piston/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:rt.language,version:rt.version,files:[{name:fname,content:code}]})});
  const j=await r.json();let out='';
  if(j.message)return '[API 오류] '+j.message;
  if(j.compile&&(j.compile.stderr||j.compile.code))out+='[컴파일]\n'+(j.compile.stderr||'')+'\n';
  if(j.run)out+=(j.run.stdout||'')+(j.run.stderr||'');
  return out||JSON.stringify(j);
}
async function runIDE(){
  if(!ideEditor){alert('에디터를 불러오는 중입니다. 잠시 후 다시 시도하세요.');return;}
  const code=ideEditor.getValue();const lang=(ideCur&&ideCur.lang)||'Python';
  const btn=document.getElementById('ideRunBtn');btn.disabled=true;
  ideStat(lang==='Python'?'Pyodide 실행 중…(최초 1회 로딩 다소 소요)':'Piston 컴파일·실행 중…');ideOut('실행 중…');
  try{
    const out=(lang==='Python')?await runPython(code):await pistonRun(lang,code);
    ideOut(out||'(출력 없음)');ideStat('완료 ✓');announce('코드 실행 완료');
  }catch(e){ideOut('실행 오류: '+(e.message||e)+'\n(네트워크/외부 API 상태를 확인하세요)');ideStat('오류');}
  finally{btn.disabled=false;}
}

// ===== 오답노트 복습 (Leitner SRS 카드) =====
let rvDeck=[],rvIdx=0,rvFlip=false;
function rvStart(all){
  rvDeck=shuffle(wrongs.filter(w=>all?true:srsDue(w)));
  if(!rvDeck.length){alert(all?'복습할 오답이 없습니다.':'지금 복습 예정인 항목이 없습니다. (간격 반복 일정에 따라 나중에 다시 출제됩니다)');return;}
  rvIdx=0;rvFlip=false;rvCard();
}
function rvCard(){
  if(rvIdx>=rvDeck.length){
    document.getElementById('v-wrong').innerHTML='<h2 class="st">🔁 복습 완료</h2><div class="res"><div class="big">👏</div><p class="sub">이번 복습 세션을 마쳤습니다. 남은 오답 '+wrongs.length+'건 · 다음 복습 예정 '+dueCount()+'건</p><div class="quick" style="justify-content:center"><button class="btn" onclick="rWrong()">오답노트로</button></div></div>';return;
  }
  const w=rvDeck[rvIdx];const box='<span class="rv-box">Leitner '+(w.box||1)+'/5</span>';
  const front='<div class="rv-tag">['+(w.tag||'')+'] '+box+'</div><div class="rvq">'+esc(w.q)+'</div>'+(w.code?'<pre class="cpre" style="margin-top:10px;text-align:left">'+esc(w.code)+'</pre>':'')+'<div class="hint" style="margin-top:12px">정답을 떠올린 뒤 카드를 눌러 확인하세요</div>';
  const back='<div class="rv-tag">['+(w.tag||'')+'] '+box+'</div><div class="rvq" style="color:#15803d">정답: '+esc(w.a)+'</div>'+(w.e?'<div class="rev" style="border-left-color:#6366f1;margin-top:10px;text-align:left"><div class="rv-exp">'+esc(w.e)+'</div></div>':'');
  document.getElementById('v-wrong').innerHTML='<h2 class="st">🔁 오답 복습 ('+(rvIdx+1)+'/'+rvDeck.length+')</h2><p class="sub">간격 반복(SM-2): 회상 난이도를 평가하면 용이도(ease)에 따라 다음 복습 간격이 정해집니다. 반복 숙달 시 노트에서 졸업, 틀리면 즉시 재출제됩니다.</p>'+
    '<div class="flash-stage"><div class="fcard" onclick="rvFlipCard()">'+(rvFlip?back:front)+'</div>'+
    (rvFlip
      ?'<div class="frow frow3"><button class="f-no" onclick="rvMark(2)">✗ 다시</button><button class="f-mid" onclick="rvMark(3)">~ 애매</button><button class="f-ok" onclick="rvMark(5)">✓ 완벽</button></div>'
      :'<div class="frow"><button class="btn" onclick="rvFlipCard()">정답 확인 →</button></div>')+
    '</div>';
}
function rvFlipCard(){rvFlip=!rvFlip;rvCard();}
function rvMark(q){const w=rvDeck[rvIdx];const r=srsUpdate(w,q);announce(r.graduated?'졸업 처리됨':'다음 복습 '+r.interval+'일 후');rvIdx++;rvFlip=false;rvCard();}

// ===== 오답노트 =====
function rWrong(){
  if(!wrongs.length){document.getElementById('v-wrong').innerHTML='<h2 class="st">❌ 오답노트</h2><div class="empty">아직 틀린 문제가 없습니다.<br>1교시·2교시를 풀면 틀린 문제가 자동으로 모입니다.</div>';return;}
  const due=dueCount();
  const items=wrongs.map((w,i)=>'<div class="witem"><button class="del" onclick="delWrong('+i+')">삭제</button><div class="wq">['+(w.tag||'')+'] <span class="rv-box">L'+(w.box||1)+'</span>'+(srsDue(w)?'<span class="due-tag">복습 예정</span>':'<span class="next-tag">다음 복습 '+daysUntil(w)+'</span>')+' '+esc(w.q)+'</div><div class="wa">정답: '+esc(w.a)+'</div><div class="we">해설: '+esc(w.e)+'</div></div>').join('');
  document.getElementById('v-wrong').innerHTML='<h2 class="st">❌ 오답노트 ('+wrongs.length+')</h2><p class="sub">간격 반복(SM-2) 복습으로 약점을 굳히세요. 오늘 복습 예정 <b>'+due+'</b>건.</p>'+
   '<div class="quick"><button class="qbtn" onclick="rvStart(false)">🔁 오늘 복습 시작 ('+due+')</button><button class="qbtn ghost" onclick="rvStart(true)">전체 복습</button><button class="reset" onclick="clearWrong()" style="margin-left:auto">전체 비우기</button></div>'+
   '<div class="wlist" style="margin-top:14px">'+items+'</div>';
}
function delWrong(i){wrongs.splice(i,1);save('wrong',wrongs);rWrong();}
function clearWrong(){if(confirm('오답노트를 전부 비울까요?')){wrongs=[];save('wrong',wrongs);rWrong();}}

// ===== 접근성(WCAG) 초기화: 탭 ARIA · 패널 role · 1교시 키보드 단축키 =====
function a11yInit(){
  document.querySelectorAll('.tab').forEach(t=>{t.setAttribute('role','tab');t.setAttribute('aria-selected',t.classList.contains('on')?'true':'false');});
  document.querySelectorAll('.view').forEach(x=>{x.setAttribute('role','tabpanel');x.setAttribute('tabindex','0');});
  // 1교시 이론 키보드: 숫자(객관식 보기)/O·X(OX)/Enter(다음)
  document.addEventListener('keydown',function(e){
    const ev=document.getElementById('v-exam'); if(!ev||!ev.classList.contains('on'))return;
    if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
    const q=exPool[exIdx]; if(!q)return;
    if(q.type==='MC'&&/^[1-9]$/.test(e.key)){const i=+e.key-1;if(q.o&&i<q.o.length)pickEx(i);}
    else if(q.type==='OX'){if(/^[oO1]$/.test(e.key))pickEx(true);else if(/^[xX2]$/.test(e.key))pickEx(false);}
    if(e.key==='Enter'){e.preventDefault();nextEx();}
  });
}
a11yInit();
rDash();
