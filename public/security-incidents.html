/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var CONCEPTS=(window.ACADEMY_DATA&&window.ACADEMY_DATA.CONCEPTS)||[];
function conceptOf(cwe){return CONCEPTS.find(function(c){return c.cwe===cwe;})||null;}
function nm(it){return isEn()?it.en:it.name;}
function impOf(it){return isEn()?it.impEn:it.imp;}
function lessonOf(it){return isEn()?it.lessonEn:it.lesson;}

function linksFor(it){
  var sim=(window.SIM_BY_CWE||{})[it.cwe];
  var html='';
  if(sim)html+='<a class="sim" href="'+sim+'" target="_blank" rel="noopener">🧪 '+L('시뮬레이터','Simulator')+'</a>';
  html+='<a href="content-map.html" target="_blank" rel="noopener">📖 '+L('개념','Concept')+'</a>';
  html+='<a href="code-fix-lab.html" target="_blank" rel="noopener">🛠️ '+L('수정 실습','Fix')+'</a>';
  return html;
}

/* ---------- today ---------- */
function todayIndex(){
  var d=new Date();
  var doy=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000);
  return doy%INC.length;
}
function renderToday(){
  var it=INC[todayIndex()];var c=conceptOf(it.cwe);
  document.getElementById('today').innerHTML=
    '<div class="tag">📌 '+L('오늘의 보안 사건','TODAY\'S INCIDENT')+' · '+it.y+'</div>'+
    '<h2>'+esc(nm(it))+' <span style="font-family:var(--mono);font-size:13px;color:#fda4af">'+esc(it.cve)+'</span></h2>'+
    '<div class="impact">'+esc(impOf(it))+'</div>'+
    '<div class="badges" style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge cwe">'+esc(it.cwe)+(c?' · '+esc(c.name):'')+'</span>'+(c?'<span class="badge">'+esc(c.cat)+'</span>':'')+'</div>'+
    '<div class="lesson">💡 '+esc(lessonOf(it))+'</div>'+
    '<div class="inc"><div class="links" style="margin-top:0">'+linksFor(it)+'</div></div>';
}

/* ---------- grid ---------- */
function populateCats(){
  var cats=[];INC.forEach(function(it){var c=conceptOf(it.cwe);if(c&&cats.indexOf(c.cat)<0)cats.push(c.cat);});
  var sel=document.getElementById('f-cat');cats.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
}
function render(){
  var cat=document.getElementById('f-cat').value;
  var dec=document.getElementById('f-decade').value;
  var q=(document.getElementById('f-search').value||'').toLowerCase();
  var rows=INC.filter(function(it){
    var c=conceptOf(it.cwe);
    if(cat&&(!c||c.cat!==cat))return false;
    if(dec&&Math.floor(it.y/10)*10!==+dec)return false;
    if(q){var hay=(it.name+' '+it.en+' '+it.cve+' '+it.cwe).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  }).sort(function(a,b){return b.y-a.y;});
  var box=document.getElementById('grid');box.innerHTML='';
  rows.forEach(function(it){
    var c=conceptOf(it.cwe);
    var el=document.createElement('div');el.className='inc';
    el.innerHTML='<div class="yr">'+it.y+'</div><h3>'+esc(nm(it))+'</h3>'+
      '<div class="cve">'+esc(it.cve)+'</div>'+
      '<div class="imp">'+esc(impOf(it))+'</div>'+
      '<div class="badges"><span class="badge cwe">'+esc(it.cwe)+'</span>'+(c?'<span class="badge">'+esc(c.name)+'</span>':'')+'</div>'+
      '<div class="links">'+linksFor(it)+'</div>';
    box.appendChild(el);
  });
  renderToday();
}

/* ---------- init ---------- */
['f-cat','f-decade'].forEach(function(id){document.getElementById(id).addEventListener('change',render);});
document.getElementById('f-search').addEventListener('input',render);
document.addEventListener('DOMContentLoaded',function(){applyLang();populateCats();render();});
</script>
